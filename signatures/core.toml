[[signature]]
name = "ext"
format = "ext"
category = "filesystem"
hex = "53ef"
magic_offset = 0x438
endian = "little"
validator = "ext"
description = "ext2/ext3/ext4 superblock magic 0xEF53 at 0x38 into the superblock, which sits 1024 bytes into the filesystem"
references = ["https://www.kernel.org/doc/html/latest/filesystems/ext4/globals.html"]

[[signature]]
name = "cramfs-le"
format = "cramfs"
category = "filesystem"
hex = "453dcd28"
endian = "little"
validator = "cramfs"
description = "cramfs superblock, little-endian; 'Compressed ROMFS' signature required, image CRC checked"
references = ["https://elixir.bootlin.com/linux/latest/source/include/uapi/linux/cramfs_fs.h"]

[[signature]]
name = "cramfs-be"
format = "cramfs"
category = "filesystem"
hex = "28cd3d45"
endian = "big"
validator = "cramfs"
description = "cramfs superblock, big-endian; 'Compressed ROMFS' signature required, image CRC checked"

[[signature]]
name = "fat32"
format = "fat"
category = "filesystem"
magic = "FAT32   "
