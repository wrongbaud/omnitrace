category = "filesystem"
magic = "FAT16   "
magic_offset = 54
endian = "little"
validator = "fat"
description = "FAT16 volume; the file-system type string in the FAT12/16 BPB"
references = ["https://download.microsoft.com/download/1/6/1/161ba512-40e2-4cc9-843a-923143f3456c/fatgen103.doc"]

[[signature]]
name = "fat12"
format = "fat"
category = "filesystem"
magic = "FAT12   "
magic_offset = 54
endian = "little"
validator = "fat"
description = "FAT12 volume; the file-system type string in the FAT12/16 BPB"
references = ["https://download.microsoft.com/download/1/6/1/161ba512-40e2-4cc9-843a-923143f3456c/fatgen103.doc"]

[[signature]]
name = "fat-generic"
format = "fat"
category = "filesystem"
magic = "FAT     "
magic_offset = 54
endian = "little"
validator = "fat"
description = "FAT volume whose type string does not name a width; the cluster count decides FAT12 or FAT16"
references = ["https://download.microsoft.com/download/1/6/1/161ba512-40e2-4cc9-843a-923143f3456c/fatgen103.doc"]

[[signature]]
name = "romfs"
format = "romfs"
category = "filesystem"
magic = "-rom1fs-"
endian = "big"
validator = "romfs"
max_name_len = 256
description = "romfs superblock; volume name checked, 512-byte header checksum verified"
references = ["https://www.kernel.org/doc/Documentation/filesystems/romfs.txt"]

[[signature]]
name = "qnx6-le"
format = "qnx6"
category = "filesystem"
hex = "22111968"
magic_offset = 0x2000
endian = "little"
alignment = 4096
validator = "qnx6"
description = "QNX6 (Power-Safe) superblock magic 0x68191122; the first superblock sits 0x2000 bytes into the partition, after the boot block"
references = ["https://elixir.bootlin.com/linux/latest/source/fs/qnx6/qnx6.h", "https://www.qnx.com/developers/docs/7.1/#com.qnx.doc.neutrino.sys_arch/topic/fsys_Power-Safe_filesystem.html"]

[[signature]]
name = "qnx6-be"
format = "qnx6"
category = "filesystem"
hex = "68191122"
magic_offset = 0x2000
endian = "big"
alignment = 4096
validator = "qnx6"
description = "QNX6 (Power-Safe) superblock magic 0x68191122, big-endian"

[[signature]]
name = "qnx-ifs"
format = "qnx-ifs"
category = "filesystem"
hex = "eb7eff00"
magic_offset = 0
endian = "little"
validator = "qnx-ifs"
description = "QNX IFS startup header (magic 0x00FF7EEB)"
references = ["https://www.qnx.com/developers/docs/7.1/#com.qnx.doc.neutrino.building/topic/startup_header.html"]

# ------------------------------------------------------------------ containers

[[signature]]
name = "cpio-newc"
format = "cpio"
category = "container"
validator = "cpio"
max_entries = 200000
magic = "070701"
description = "cpio archive, SVR4 'newc' ASCII header"
references = ["https://www.kernel.org/doc/html/latest/driver-api/early-userspace/buffer-format.html"]

[[signature]]
name = "cpio-crc"
format = "cpio"
category = "container"
validator = "cpio"
max_entries = 200000
magic = "070702"
description = "cpio archive, SVR4 ASCII header with CRC"

[[signature]]
name = "cpio-odc"
format = "cpio"
category = "container"
validator = "cpio"
max_entries = 200000
magic = "070707"
description = "cpio archive, POSIX 'odc' ASCII header"

[[signature]]
name = "tar-ustar"
format = "tar"
category = "container"
magic = "ustar"
magic_offset = 257
validator = "tar"
max_entries = 200000
description = "POSIX ustar / GNU tar header (magic at 257 into the 512-byte header)"
references = ["https://www.gnu.org/software/tar/manual/html_node/Standard.html"]

[[signature]]
name = "zip"
format = "zip"
category = "container"
validator = "zip"
max_entries = 200000
# How far past a member with deferred sizes to look for its data descriptor.
max_descriptor_search = 67108864
# How far to look for the central directory when something (an APK Signing
# Block) sits between the last member and it.
max_gap_search = 16777216
hex = "504b0304"
endian = "little"
description = "ZIP local file header"
references = ["https://pkware.cachefly.net/webdocs/casestudies/APPNOTE.TXT"]

[[signature]]
name = "7z"
format = "7z"
category = "container"
hex = "377abcaf271c"
endian = "little"
validator = "7z"
description = "7-Zip archive. The 32-byte signature header carries the offset and length of the header at the far end of the archive and a CRC over both, so the extent is exact; the header itself is usually compressed and is decoded to list the entries"
references = ["https://github.com/ip7z/7zip/blob/main/DOC/7zFormat.txt"]

[[signature]]
name = "uimage"
format = "uimage"
category = "container"
hex = "27051956"
endian = "big"
validator = "uimage"
description = "U-Boot legacy image header; header CRC verified, payload CRC checked"
references = ["https://source.denx.de/u-boot/u-boot/-/blob/master/include/image.h"]

[[signature]]
name = "fit-dtb"
format = "dtb"
category = "other"
hex = "d00dfeed"
endian = "big"
validator = "dtb"
max_nodes = 65536
max_props = 262144
max_depth = 64
description = "Flattened device tree blob; header and structure block validated, size = totalsize. A FIT (root with /images) is reported by the 'fit' signature and this one steps back to structural"
references = ["https://devicetree-specification.readthedocs.io/en/latest/chapter5-flattened-format.html"]

[[signature]]
name = "fit"
format = "fit"
category = "container"
hex = "d00dfeed"
endian = "big"
validator = "fit"
max_nodes = 65536
max_props = 262144
max_depth = 64
max_hash_bytes = 1073741824
description = "U-Boot FIT image (FDT with /images); image inventory and configurations listed, crc32/md5/sha1/sha256 hashes verified, external data included in the size"
references = ["https://docs.u-boot.org/en/latest/usage/fit/source_file_format.html"]

[[signature]]
name = "android-boot"
format = "android-boot"
category = "container"
magic = "ANDROID!"
endian = "little"
validator = "android-boot"
description = "Android boot image header v0-v4; size = sum of page-aligned sections"
references = ["https://source.android.com/docs/core/architecture/bootloader/boot-image-header"]

[[signature]]
name = "android-vendor-boot"
format = "android-vendor-boot"
category = "container"
magic = "VNDRBOOT"
endian = "little"
validator = "android-boot"
description = "Android vendor boot image header v3/v4"
references = ["https://source.android.com/docs/core/architecture/bootloader/partitions/vendor-boot-partitions"]

[[signature]]
name = "android-sparse"
format = "android-sparse"
category = "container"
# SPARSE_HEADER_MAGIC is 0xed26ff3a in a __le32 field, so the bytes on disk
# are the reverse. Writing the constant here instead meant the signature never
# matched a real image; img2simg output is what caught it.
hex = "3aff26ed"
endian = "little"
validator = "android-sparse"
description = "Android sparse image (simg); chunk list walked"
references = ["https://android.googlesource.com/platform/system/core/+/master/libsparse/sparse_format.h"]

# ------------------------------------------------------------ partition tables

[[signature]]
name = "mbr"
format = "mbr"
category = "partition-table"
hex = "55aa"
magic_offset = 510
endian = "little"
validator = "mbr"
ebr_max_chain = 128
description = "DOS/MBR partition table (0x55AA at 510); EBR chains walked up to ebr_max_chain links"

[[signature]]
name = "gpt"
format = "gpt"
category = "partition-table"
magic = "EFI PART"
magic_offset = 512
endian = "little"
validator = "gpt"
max_entries = 1024
description = "GUID partition table with 512-byte sectors (header at LBA 1)"
references = ["https://uefi.org/specs/UEFI/2.10/05_GUID_Partition_Table_Format.html"]

[[signature]]
name = "gpt-4k"
format = "gpt"
category = "partition-table"
magic = "EFI PART"
magic_offset = 4096
endian = "little"
validator = "gpt"
max_entries = 1024
description = "GUID partition table with 4096-byte sectors (header at LBA 1)"

# A GPT header whose leading "EFI " has been cleared. The header CRC32 covers
# the signature, so one of these is only a GPT when the CRC matches over the
# bytes as stored -- which is a stronger statement than the magic makes, and is
# what the validator requires before it emits anything at all. Seen on an automotive Android unit
# VCUNH unit's 116 GiB user LUN, whose backup header is an ordinary "EFI PART":
# every other tool reads the map from the end of the disk, or not at all.
[[signature]]
name = "gpt-cleared-sig"
format = "gpt"
category = "partition-table"
hex = "0000000050415254"
magic_offset = 512
endian = "little"
validator = "gpt"
max_entries = 1024
description = "GPT header with a cleared signature, 512-byte sectors; accepted only on a valid header CRC32"

[[signature]]
name = "gpt-cleared-sig-4k"
format = "gpt"
category = "partition-table"
hex = "0000000050415254"
magic_offset = 4096
endian = "little"
validator = "gpt"
max_entries = 1024
description = "GPT header with a cleared signature, 4096-byte sectors; accepted only on a valid header CRC32"

# Android dynamic partitions. The geometry magic "gDla" sits 4096 bytes into
# the super, after a reserved area that may hold a partition table of its own.
# Four bytes at a fixed offset is weak -- an eMMC image finds it in unrelated
# data -- so the validator will not size the structure, and no reader is given
# it, unless the SHA-256 liblp stores over the partition map verifies.
[[signature]]
name = "android-super"
format = "android-super"
category = "container"
magic = "gDla"
magic_offset = 4096
endian = "little"
validator = "android_super"
description = "Android logical partitions (super): liblp geometry at 4096, metadata slot 0 at 12288"
references = ["https://source.android.com/docs/core/ota/dynamic_partitions"]

# ------------------------------------------------------------------ compressed

[[signature]]
name = "gzip"
format = "gzip"
category = "compressed"
hex = "1f8b08"
endian = "little"
validator = "gzip"
max_name_len = 4096
# Bounds for the stream walk that gives the finding its extent: the payload may
# be at most max_ratio times the input still available, and never more than
# max_payload. A stream that wants more is abandoned unsized.
max_ratio = 1000
max_payload = 4294967296
description = "gzip member with deflate compression"
references = ["https://www.rfc-editor.org/rfc/rfc1952"]

[[signature]]
name = "xz"
format = "xz"
category = "compressed"
hex = "fd377a585a00"
endian = "little"
validator = "xz"
max_ratio = 1000
max_payload = 4294967296
description = ".xz stream header; stream flags CRC verified"
references = ["https://tukaani.org/xz/xz-file-format.txt"]

# LZMA-alone has no magic, so each signature keys on one properties byte
# (lc + lp*9 + pb*45) followed by the two zero bytes that a dictionary size of
# a multiple of 64 KiB always has. The decode probe in the validator is what
# actually decides. Add a line per properties byte you meet: 0x5d is the
# encoder default, 0x6d is what OpenWrt's lzma-loader emits.
[[signature]]
name = "lzma-lc3-lp0-pb2"
format = "lzma"
category = "compressed"
hex = "5d0000"
endian = "little"
validator = "lzma"
max_ratio = 1000
max_payload = 4294967296
description = "LZMA-alone stream, lc=3 lp=0 pb=2 (the encoder default)"
references = ["https://tukaani.org/xz/xz-file-format.txt"]

[[signature]]
name = "lzma-lc1-lp2-pb2"
format = "lzma"
category = "compressed"
hex = "6d0000"
endian = "little"
validator = "lzma"
max_ratio = 1000
max_payload = 4294967296
description = "LZMA-alone stream, lc=1 lp=2 pb=2 (OpenWrt lzma-loader)"

[[signature]]
name = "bzip2"
format = "bzip2"
category = "compressed"
magic = "BZh"
endian = "big"
validator = "bzip2"
max_ratio = 1000
max_payload = 4294967296
description = "bzip2 stream; the block-size digit and the 48-bit block magic are checked"
references = ["https://sourceware.org/bzip2/"]

[[signature]]
name = "lz4-frame"
format = "lz4"
category = "compressed"
hex = "04224d18"
endian = "little"
validator = "lz4"
max_ratio = 1000
max_payload = 4294967296
description = "LZ4 frame"
references = ["https://github.com/lz4/lz4/blob/dev/doc/lz4_Frame_format.md"]

[[signature]]
name = "zstd"
format = "zstd"
category = "compressed"
hex = "28b52ffd"
endian = "little"
validator = "zstd"
max_ratio = 1000
max_payload = 4294967296
description = "Zstandard frame"
references = ["https://www.rfc-editor.org/rfc/rfc8878"]

# ------------------------------------------------------------------ executables

[[signature]]
name = "elf"
format = "elf"
category = "other"
hex = "7f454c46"
validator = "elf"
description = "ELF executable, shared object or relocatable; header validated, size from the program/section header extents; unaligned hits must reach consistent"
references = ["https://refspecs.linuxfoundation.org/elf/elf.pdf"]

