# core.toml — built-in format signatures for OmniTrace discovery.
# Schema and validator contract: docs/formats/signatures.md
# Offsets are relative to the structure start; magic_offset says where in the
# structure the magic sits, so the scanner subtracts it from every hit.

# ----------------------------------------------------------------- filesystems

[[signature]]
name = "squashfs-le"
format = "squashfs"
category = "filesystem"
magic = "hsqs"
endian = "little"
validator = "squashfs"
description = "SquashFS v4 superblock, little-endian"
references = ["https://dr-emann.github.io/squashfs/", "https://elixir.bootlin.com/linux/latest/source/fs/squashfs/squashfs_fs.h"]

[[signature]]
name = "squashfs-be"
format = "squashfs"
category = "filesystem"
magic = "sqsh"
endian = "big"
validator = "squashfs"
description = "SquashFS v4 superblock, big-endian"
references = ["https://dr-emann.github.io/squashfs/"]

[[signature]]
name = "squashfs-vendor-shsq"
format = "squashfs"
category = "filesystem"
magic = "shsq"
validator = "squashfs"
description = "SquashFS with vendor (DD-WRT/Broadcom) magic 'shsq'; byte order inferred from the version field"
references = ["https://github.com/ReFirmLabs/binwalk/blob/master/src/binwalk/magic/filesystems"]

[[signature]]
name = "squashfs-vendor-qshs"
format = "squashfs"
category = "filesystem"
magic = "qshs"
validator = "squashfs"
description = "SquashFS with vendor magic 'qshs'; byte order inferred from the version field"

[[signature]]
name = "jffs2-le"
format = "jffs2"
category = "filesystem"
hex = "8519"
endian = "little"
alignment = 4
validator = "jffs2"
max_gap = 131072
description = "JFFS2 node (magic 0x1985 stored little-endian); node header CRC verified; nodes coalesced across gaps up to max_gap bytes"
references = ["https://elixir.bootlin.com/linux/latest/source/include/uapi/linux/jffs2.h"]

[[signature]]
name = "jffs2-be"
format = "jffs2"
category = "filesystem"
hex = "1985"
endian = "big"
alignment = 4
validator = "jffs2"
max_gap = 131072
description = "JFFS2 node (magic 0x1985 stored big-endian); node header CRC verified; nodes coalesced across gaps up to max_gap bytes"

[[signature]]
name = "ubi"
format = "ubi"
category = "container"
magic = "UBI#"
endian = "big"
validator = "ubi"
description = "UBI erase-counter header at the start of a physical erase block"
references = ["https://elixir.bootlin.com/linux/latest/source/drivers/mtd/ubi/ubi-media.h"]

[[signature]]
name = "ubifs"
format = "ubifs"
category = "filesystem"
hex = "31181006"
endian = "little"
validator = "ubifs"
description = "UBIFS superblock node (common-header magic 0x06101831, node type 6); node CRC verified; accepted only at a min_io_size/512 aligned offset"
