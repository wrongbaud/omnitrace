pack: credentials
version: 1
description: >
  Secrets that grant access to something: account records, private keys and
  the API tokens vendors leave in firmware. These are the highest-severity
  rules in the built-in set, because a hit is usually actionable on its own.

rules:
  - id: shadow-file
    category: users
    kind: glob-path
    pattern: '**/etc/shadow*'
    severity: critical
    description: Hashed account passwords

  - id: passwd-file
    category: users
    kind: glob-path
    pattern: '**/etc/passwd*'
    severity: high
    description: Account list, shells and home directories

  - id: shadow-hash
    category: credentials
    kind: regex
    # $id$[rounds=N$]salt$hash. The salt and hash sections are spelled out
    # rather than lumped into one character class that admits '$': the loose
    # form matched samba's case-mapping tables, which are full of "$1$2$3$4$".
    pattern: '\$(?:1|2[aby]|5|6|y)\$(?:rounds=[0-9]+\$)?[./A-Za-z0-9]{1,32}\$[./A-Za-z0-9]{12,128}'
    severity: critical
    description: crypt(3) password hash, whatever file it turned up in

  - id: private-key-pem
    category: certs
    kind: regex
    pattern: '-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----'
    severity: critical
    description: Private key in PEM form

  - id: certificate-pem
    category: certs
    kind: regex
    pattern: '-----BEGIN CERTIFICATE-----'
    severity: low
    description: X.509 certificate in PEM form

  - id: ssh-authorized-keys
    category: users
    kind: glob-path
    pattern: '**/.ssh/authorized_keys'
    severity: high
    description: Keys granting SSH access to this device

  - id: ssh-host-key
    category: certs
    kind: glob-path
    pattern: '**/ssh_host_*_key'
    severity: high
    description: SSH host private key; identifies the device and allows impersonation

  - id: dropbear-key
    category: certs
    kind: glob-path
    pattern: '**/dropbear_*_host_key'
    severity: high
    description: Dropbear host key, the usual SSH implementation on embedded Linux

  - id: aws-access-key
    category: credentials
    kind: regex
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    severity: critical
    description: AWS access key id

  - id: google-api-key
    category: credentials
    kind: regex
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
    severity: high
    description: Google API key

  - id: slack-token
    category: credentials
    kind: regex
    pattern: '\bxox[abprs]-[0-9A-Za-z-]{10,72}\b'
    severity: critical
    description: Slack token

  - id: jwt
    category: credentials
    kind: regex
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'
    severity: high
    description: JSON Web Token; the payload is base64 and often readable

  - id: password-assignment
    category: credentials
    kind: regex
    # The assignment has to be the whole line. Without that this matches every
    # `password = obj.newPassword` in a web UI's JavaScript: on the router
    # corpus image it fired 581 times, almost all of it source code.
    pattern: '(?im)^[ \t]*(?:password|passwd|passphrase|secret)[ \t]*[=:][ \t]*"?([^\s"''\n\r]{4,64})"?[ \t]*$'
    severity: high
    description: A password assigned on its own line in a configuration file
