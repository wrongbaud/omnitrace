name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  docs:
    # First and cheapest: the generated reference must match the code, every
    # validator/reader needs its docs/formats page, docs/CLI.md must name every
    # flag, and no Markdown link may dangle. No build, no dependencies.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs.py
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [linux-gcc, linux-clang, linux-asan]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang zlib1g-dev liblzma-dev liblz4-dev libzstd-dev libssl-dev libyaml-cpp-dev nlohmann-json3-dev libcli11-dev libspdlog-dev libgtest-dev pkg-config squashfs-tools e2fsprogs dosfstools mtd-utils
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel
      - run: ctest --preset ${{ matrix.preset }}
  vcpkg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, preset: windows-msvc }
          - { os: macos-14,     preset: macos-clang }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with: { vcpkgGitCommitId: b322364f06075bb2d0c88d4c5a9e2d6aa8a5cdba }
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel
      - run: ctest --preset ${{ matrix.preset }}
