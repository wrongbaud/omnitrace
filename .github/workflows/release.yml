# Publish a container image when a version tag is pushed.
#
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
#
# The image is built, then *run against a fixture*, and only then pushed. A
# container that compiles but writes an empty case directory is worse than no
# container, because the case looks like evidence.
name: release
on:
  push:
    tags: ['v*']
  # A dry run: builds and smoke-tests the image without publishing it.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.2.0 publishes 0.2.0, 0.2 and latest; a prerelease tag gets no
          # `latest`, which is metadata-action's default for semver.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.revision=${{ steps.sha.outputs.short }}

      # Built and loaded locally first so the next step can run the real image.
      # The builder stage runs ctest, so a broken build never reaches here.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: omnitrace:smoke
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: scripts/smoke_container.sh omnitrace:smoke ${{ steps.sha.outputs.short }}

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cached from the build above, so this re-exports rather than rebuilds.
      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha

      - name: Summary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Built from \`${{ steps.sha.outputs.short }}\`, which is what"
            echo "\`omnitrace --version\` and every case's \`git_sha\` will report."
          } >> "$GITHUB_STEP_SUMMARY"
