# diagnostics.yaml - curated meaning and examiner action for every diagnostic
# and status code emitted by src/ and apps/. scripts/gen_docs.py joins this
# with the source sites into docs/reference/DIAGNOSTICS.md and fails when a
# code here has no source or a code in source has no entry here.
#
# Format (a YAML subset read by scripts/gen_docs.py):
#   <code>:
#     meaning: one line, what happened
#     action: one line, what the examiner or contributor should do
# Keep entries short. Codes are sorted alphabetically.

also-matched:
  meaning: another signature matched the same bytes with lower confidence; the winner is this node
  action: informational; check the named format only if the winner turns out to be wrong

analyze-empty-image:
  meaning: the evidence file has zero bytes
  action: verify the acquisition; there is nothing to analyse

analyze-limit-depth:
  meaning: nesting went deeper than Limits::max_depth, so that branch was not analysed
  action: re-run with a larger --max-depth if the nested content matters

analyze-limit-disk:
  meaning: the extraction budget was larger than the output filesystem's free space and was cut to fit
  action: free space, pass a different --out, or set --max-bytes to a figure that fits; the run continues and stops at the reduced budget with sink-limit-bytes

analyze-limit-files:
  meaning: the run-wide --max-files budget was spent before this filesystem, so it was not walked
  action: re-run with a larger --max-files or --no-extract for an inventory

analyze-nested-open-failed:
  meaning: an extracted file could not be re-opened for nested analysis, so anything inside it was not found
  action: check free space and permissions on the case directory; the file itself is still extracted

analyze-no-image:
  meaning: analyze() was called with a null Source (caller bug)
  action: contributor error; the CLI never produces this

analyze-no-out-dir:
  meaning: extraction was requested without a case directory (caller bug)
  action: contributor error; the CLI always passes --out

analyze-no-reader:
  meaning: the format was recognised but no reader is registered, so nothing was walked or opened
  action: carve the node (partitions/) and use an external tool; the coverage row says unsupported

analyze-open-failed:
  meaning: a registered reader rejected the structure at open(); the message carries the reader's status code
  action: treat the finding as identification only; inspect the carved bytes by hand

analyze-sink-failed:
  meaning: the case directory could not receive the extracted tree (DiskSink::open or mkdir failed)
  action: fix the host path or permissions and re-run

analyze-walk-failed:
  meaning: the reader started but could not finish the walk; entries emitted before the failure are kept
  action: the listing is incomplete; compare with an external extraction of the carved file

android-boot-bad-header:
  meaning: header_version or page_size is outside the values the format allows
  action: magic-tier hit; probably not a boot image, or a vendor variant

android-boot-empty:
  meaning: kernel_size and ramdisk_size are both zero
  action: the header carries no payload; look for the real boot image elsewhere

android-boot-truncated:
  meaning: the page-aligned sections extend past the available data; size clamped
  action: the dump or partition is short; expect a partial kernel or ramdisk

android-boot-truncated-header:
  meaning: fewer bytes than the header needs after the magic
  action: magic-tier hit at the end of the data; usually noise

bzip2-truncated-header:
  meaning: fewer than 4 bytes were available for the bzip2 header
  action: magic-tier hit at the end of the data; nothing was lost

carve-dir-failed:
  meaning: partitions/ could not be created; nothing was carved
  action: fix the host path or permissions and re-run

carve-limit-disk:
  meaning: the node was not carved because the output filesystem does not have room for it
  action: free space or carve the range with dd from location.offset; carving has no run-wide byte budget, so the disk is what bounds it

carve-limit-bytes:
  meaning: the node is larger than --max-carve-bytes and was not written
  action: re-run with a larger --max-carve-bytes or carve the range with dd from location.offset

carve-mount-script-failed:
  meaning: partitions/mount.sh could not be written
  action: fix the host path; the carved files themselves are intact

carve-short-read:
  meaning: the evidence returned fewer bytes than the node claims while carving; the file is short
  action: the image is unreadable past that point; check the acquisition

carve-unknown-size:
  meaning: the finding has no known extent, so there is nothing to carve
  action: identification only; use the offset with an external tool if needed

carve-write-failed:
  meaning: writing the carved file failed; the partial file was removed
  action: check free space and permissions, then re-run

compressed-stream-checksum-mismatch:
  meaning: the stream decoded to its natural end and then disagreed with the checksum recorded in its own header; it is still sized and read
  action: treat the payload as damaged evidence, not as a faithful copy; the compressed bytes themselves are intact enough to decode, so the corruption is in the data or in the recorded check

compressed-stream-unmeasured:
  meaning: the decoder could not follow a gzip or xz stream to its end, so the finding has no extent and claims no bytes
  action: informational; the stream is damaged, truncated or a bomb (it is abandoned at max_ratio/max_payload from the signature)

container-bad-header:
  meaning: the container's magic is right but its header is not self-consistent, or does not describe the shape this reader walks
  action: the structure is damaged or is a neighbouring format (a plain DTB rather than a FIT); the node keeps the validator's finding

container-bad-magic:
  meaning: the container reader was opened on bytes that do not start with its magic
  action: contributor error or a stale signature; the node keeps the validator's finding

container-checksum-mismatch:
  meaning: the payload does not match the checksum the stream records over it; it is emitted anyway because the bytes are all there and the mismatch is itself evidence
  action: treat the payload as damaged; for lz4 and zstd it may also be short by up to 64 KiB, because neither library reports what it wrote on the call that failed the check

container-decompress-failed:
  meaning: a compressed container did not decode, so no payload was emitted
  action: the stream is damaged or uses an unsupported variant; carve the node and try the vendor's tool

container-empty:
  meaning: the container reader was opened on an empty Span
  action: the image is truncated at the container's first byte

container-limit-file-bytes:
  meaning: a container payload exceeds Limits::max_file_bytes and was cut there
  action: re-run with a larger --max-file-bytes to recover the whole payload

container-not-open:
  meaning: walk() was called before a successful open() (caller bug)
  action: contributor error; analyze() never produces this

container-section-truncated:
  meaning: a section of a wrapper image (uImage payload, boot image kernel or ramdisk, FIT image payload) is shorter than its header claims
  action: the dump or partition is short; what was present is still extracted and marked truncated

container-sink-error:
  meaning: the Sink refused the container payload (unsafe path or its own limit)
  action: see the sink-* code quoted in the message

container-truncated:
  meaning: the container's own header or index is not inside the bytes the node covers, so there is nothing to walk
  action: the dump or partition is short at the container's start; carve the node and re-run against the full image

container-unreadable:
  meaning: the container's bytes could not be read out of the Source
  action: the image is truncated or the underlying file became unreadable mid-run

cpio-bad-header:
  meaning: a cpio member header is not readable, so the walk stops there
  action: the archive is damaged or the magic was a false positive; members before this one are still extracted

cpio-limit-entries:
  meaning: Limits::max_nodes_per_fs was reached inside a cpio archive
  action: re-run with a larger cap if the remaining members matter

cpio-no-trailer:
  meaning: no TRAILER!!! member was reached, so the archive has no extent and claims no bytes
  action: informational; a stray 070701 in other data looks like this, and so does a truncated archive

cpio-truncated:
  meaning: a cpio member or the archive itself runs past the available data
  action: the dump is short; entries before the cut are still extracted

cramfs-bad-block:
  meaning: a file's block-pointer table or one of its block pointers lies outside the image, or a pointer runs backwards
  action: the image is damaged or the offsets were forged; the entry is listed with whatever decoded before that block

cramfs-bad-inode:
  meaning: an inode is unreadable, runs past its directory's data, or a directory's data lies outside the image
  action: the rest of that directory is not walked; entries before it are still emitted

cramfs-bad-magic:
  meaning: no cramfs magic at the start of the span, in either byte order
  action: contributor error or a stale signature; the node keeps the validator's finding

cramfs-bad-root:
  meaning: the root inode is unreadable or is not a directory
  action: the superblock matched but its root does not; treat the image as damaged and carve it for another tool

cramfs-bad-signature:
  meaning: the 16-byte "Compressed ROMFS" signature is not at offset 16
  action: the 4-byte magic alone turns up in compressed data; without the signature this is not a cramfs image

cramfs-bad-size:
  meaning: the superblock size or file count is out of range
  action: magic-tier hit; probably not a cramfs image

cramfs-crc-mismatch:
  meaning: the image CRC32 does not match the superblock field
  action: the image is modified or truncated; extract with care and note it in the report

cramfs-cycle:
  meaning: a directory's data offset points at a directory that was already walked, so the tree loops
  action: the branch is cut there; the image is damaged or was built to loop

cramfs-decompress-failed:
  meaning: a zlib block did not inflate
  action: the block is damaged or uses a variant this build does not have; the file is cut at that block and marked truncated

cramfs-limit-depth:
  meaning: directory nesting went deeper than the reader's bound
  action: the image is looping through fresh offsets each step; the branch is not descended

cramfs-limit-nodes:
  meaning: max_nodes_per_fs was reached
  action: raise --max-nodes-per-fs for a trusted image; this is the guard against a directory run that never ends

cramfs-not-open:
  meaning: walk() was called before a successful open()
  action: contributor error in a caller, not something an image causes

cramfs-sink-error:
  meaning: the Sink refused an entry (unsafe path or a limit)
  action: see the sink-* code quoted in the message

cramfs-truncated:
  meaning: the superblock size extends past the available data; size clamped
  action: the dump or partition is short

cramfs-unknown-flags:
  meaning: flag bits outside the ones cramfs defines are set
  action: informational; may be a vendor variant

cramfs-unsupported-flags:
  meaning: the image sets EXT_BLOCK_POINTERS, whose high pointer bits this build does not decode
  action: file contents may be wrong; compare against the vendor's tooling before relying on them

cramfs-v1-no-size:
  meaning: FSID_VERSION_2 is clear, so the size and fsid fields are not valid and the extent is unknown
  action: old cramfs; carve manually if needed

decompress-failed:
  meaning: a raw filter chain (7z's coders, or an .xz chain) returned an error partway through
  action: the compressed bytes are damaged or the chain is not what the container said; what decoded before the error is not kept

decompress-props:
  meaning: a coder's properties bytes were rejected by the decoder they belong to
  action: the container's header is damaged, or the coder is a variant this build does not have

decompress-size-mismatch:
  meaning: a decoder produced a different number of bytes than the container said it would
  action: the compressed data or the size in the header is wrong; treat the entry's contents as unreliable

decompress-unsupported:
  meaning: a filter id or filter chain is not one this build can run
  action: the format uses a coder liblzma does not have, or one that cannot be chained (a byte filter with no compressor under it)

dtb-is-fit:
  meaning: the device tree has an /images node, so it is a FIT image; the fit finding at the same offset wins
  action: informational; read the fit node

dtb-truncated:
  meaning: totalsize extends past the available data; size clamped
  action: the dump or partition is short

elf-extended-numbering:
  meaning: header counts use the extended numbering (PN_XNUM / section 0); the tables were not walked
  action: size may be understated; use readelf on the carved bytes

elf-no-tables:
  meaning: no program or section headers, so the extent is unknown
  action: identification only

elf-truncated:
  meaning: program/section headers or segments extend past the available data
  action: the object is cut; expect a partial binary

ext-blockmap-corrupt:
  meaning: an ext2/ext3 block map (direct or indirect pointer) names a block outside the filesystem or an unreadable indirect block; the data after that point is not recovered
  action: the entry is truncated at the bad pointer; compare with debugfs "blocks <inode>" and carve the rest by hand if it matters

ext-data-truncated:
  meaning: a data block of a file lies past the end of the image; the rest of the file is zero-filled and the entry marked truncated
  action: the dump is short (see ext-truncated-image); re-acquire the partition if the file matters

ext-deleted-blocks-reused:
  meaning: a freed inode still maps blocks that the block bitmap shows allocated to something else; those blocks are zero-filled in the recovered version
  action: the recovered content is partial; the surviving bytes are what the unallocated blocks still hold

ext-deleted-no-blocks:
  meaning: a freed inode keeps its size and times but its extent tree or block map was cleared when it was unlinked (what the kernel does), so only metadata is recoverable
  action: the name, size, owner and times are evidence; the content must be carved from unallocated space with signature-based tools

ext-dir-loop:
  meaning: a directory entry points at a directory inode that was already listed (an ancestor or a directory linked twice); it is not descended again
  action: corruption or tampering; note the inode and compare with e2fsck -n

ext-dirent-corrupt:
  meaning: a directory entry has an invalid rec_len or name_len, names a reserved inode, an empty inode, or a name containing '/' or NUL; the rest of that directory block is skipped
  action: the directory is damaged; entries before the bad one are listed; run e2fsck -n on the carved partition for the kernel's view

ext-extent-corrupt:
  meaning: an extent tree node has a bad magic, more entries than fit, a depth above 5, a child whose eh_depth or first logical block disagrees with its parent's index entry, out-of-order entries, or maps blocks outside the filesystem; the data after that point is not recovered
  action: the entry is truncated at the bad node; compare with debugfs "dump_extents <inode>"

ext-gdt-csum-mismatch:
  meaning: one or more group descriptors fail their crc16 (gdt_csum) or crc32c (metadata_csum) checksum; their bitmaps and inode tables may be stale
  action: the walk continues with the descriptors as read; history results (which depend on the bitmaps) deserve less trust

ext-inline-data-corrupt:
  meaning: an inode with INLINE_DATA_FL claims more bytes than i_block plus its system.data xattr hold, or the xattr is unreadable
  action: the entry is truncated to what is present

ext-inode-count-mismatch:
  meaning: inodes_count does not equal block_groups * inodes_per_group; consistency check failed
  action: superblock may be corrupt or hand-made; verify with e2fsck -n on the carved partition

ext-inode-csum-mismatch:
  meaning: inodes whose metadata_csum crc32c does not match; the count and the first path are in the message and each entry carries extra.checksum=mismatch
  action: those inodes were written outside the filesystem driver or the image is damaged; treat their metadata with care

ext-limit-file-bytes:
  meaning: a file's i_size exceeds Limits::max_file_bytes; its data is cut at the limit and the entry marked truncated. The same cap bounds the directory blocks read for one directory (a largedir i_size is 64-bit); entries beyond it are not listed and the walk is marked truncated
  action: re-run with a larger --max-bytes if the file matters; an absurd i_size on a hostile image is expected here

ext-limit-files:
  meaning: Limits::max_files entries were emitted; the walk stopped
  action: re-run with a larger --max-files

ext-limit-nodes:
  meaning: Limits::max_nodes_per_fs directory entries, freed inodes or slack entries were seen; the listing or history is truncated
  action: re-run with a larger limit if the filesystem is genuinely that large

ext-metadata-corrupt:
  meaning: a superblock, group descriptor, inode table, inode, bitmap or directory block could not be read or is inconsistent (Error when the root is unusable, Warning when one subtree or entry is skipped)
  action: the message names the structure; compare with dumpe2fs / debugfs on the carved partition

ext-root-invalid:
  meaning: inode 2 is not a directory
  action: not a usable ext filesystem; the superblock may belong to a wiped or partially overwritten volume

ext-sink-error:
  meaning: the Sink refused an entry (unsafe path such as a Windows reserved name, or a sink limit); the entry is not extracted
  action: the message carries the sink code; the listing still names the entry

ext-superblock-bad:
  meaning: the superblock fails a hard constraint (as a Status the reader refuses to open; as a Warning the metadata_csum crc32c does not match and the walk continues with the fields as read)
  action: verify with dumpe2fs on the carved partition; a modified superblock is itself a finding

ext-superblock-csum-mismatch:
  meaning: the metadata_csum crc32c over the superblock does not match s_checksum
  action: the superblock was modified after the last checksum update; verify with e2fsck -n

ext-truncated:
  meaning: blocks_count * block_size exceeds the available data; size clamped
  action: the partition or dump is short; the tail of the filesystem is missing

ext-truncated-image:
  meaning: the reader found blocks_count * block_size larger than the data it was given; blocks past the end read as missing and only the block groups that start inside the data are scanned (the message gives the count)
  action: the dump is short; entries whose blocks lie past the end get ext-data-truncated

ext-unsupported-feature:
  meaning: a feature the reader does not implement was met (unknown incompat bits, a journal needing recovery, encryption, casefold, compression, a non-crc32c checksum type); the entry or filesystem is still listed
  action: encrypted data is extracted as stored; a journal is never replayed, so the listing is the pre-replay state; mount a carved copy on Linux for the kernel's view

ext-xattr-corrupt:
  meaning: an extended-attribute block or in-inode xattr area has a bad magic, an entry running past its end, or a value outside the area; extra.xattrs holds what was parsed before it
  action: the attributes are damaged; compare with debugfs "ea_list <inode>"

fdt-bad-node-name:
  meaning: a node name is not terminated inside the structure block, or a non-root node is unnamed
  action: the device tree is corrupt; the finding stays at structural tier

fdt-bad-prop-name:
  meaning: a property's nameoff points outside the strings block
  action: the device tree is corrupt; the finding stays at structural tier

fdt-bad-token:
  meaning: an unknown token in the structure block
  action: the device tree is corrupt; the finding stays at structural tier

fdt-limit-depth:
  meaning: nesting exceeded the walk's max_depth; the walk stopped, so the tree is partial
  action: raise max_depth on the fit/fit-dtb signature in signatures/core.toml if the tree is genuine (the FIT reader uses the omnitrace::fdt default, 64 deep / 65536 nodes / 262144 properties)

fdt-limit-nodes:
  meaning: more nodes than the walk's max_nodes; the walk stopped, so the tree is partial
  action: raise max_nodes on the fit/fit-dtb signature in signatures/core.toml if the tree is genuine (the FIT reader uses the omnitrace::fdt default, 64 deep / 65536 nodes / 262144 properties)

fdt-limit-props:
  meaning: more properties than the walk's max_props; the walk stopped, so the tree is partial
  action: raise max_props on the fit/fit-dtb signature in signatures/core.toml if the tree is genuine (the FIT reader uses the omnitrace::fdt default, 64 deep / 65536 nodes / 262144 properties)

fdt-multiple-roots:
  meaning: a second top-level BEGIN_NODE
  action: the device tree is corrupt; the finding stays at structural tier

fdt-no-root:
  meaning: END before any node
  action: the device tree is empty or corrupt

fdt-prop-outside-node:
  meaning: a PROP token before the root node
  action: the device tree is corrupt; the finding stays at structural tier

fdt-prop-overrun:
  meaning: property data runs past the structure block
  action: the device tree is corrupt; the finding stays at structural tier

fdt-struct-overrun:
  meaning: the token stream ran past size_dt_struct
  action: the device tree is corrupt; the finding stays at structural tier

fdt-unbalanced:
  meaning: END_NODE without an open node, or END with nodes still open
  action: the device tree is corrupt; the finding stays at structural tier

fit-data-missing:
  meaning: one or more images have no payload inside the available data
  action: the FIT references data outside the dump; that image is named but not extracted

fit-hash-mismatch:
  meaning: an image hash node does not match the payload bytes
  action: the image was modified or is corrupt; note it in the report

fit-hash-unsupported:
  meaning: a hash node uses an algorithm not checked here, or was skipped by the hash budget
  action: verify with mkimage -l or dumpimage if the hash matters

fit-limit-hash-bytes:
  meaning: the payloads exceed the signature's max_hash_bytes; remaining hashes were not verified
  action: raise max_hash_bytes in signatures/core.toml to verify everything

fit-no-images:
  meaning: /images has no subnodes
  action: an empty or unusual FIT; nothing to extract

fit-truncated:
  meaning: image data extends past the available data
  action: the dump or partition is short

gpt-backup:
  meaning: this is a backup header that matches its primary
  action: informational; the primary node carries backup_lba

gpt-backup-crc-mismatch:
  meaning: the backup header folded into this primary has a CRC mismatch
  action: the backup is stale or damaged; the primary map was used

gpt-backup-mismatch:
  meaning: primary and backup headers describe different disks or entry arrays; the backup was expanded as a second map
  action: decide which map is current; a re-partitioned disk keeps the old backup at the end

gpt-bad-entry-size:
  meaning: entry_size is not a multiple of 8 of at least 128
  action: magic-tier hit; not a usable GPT header

gpt-bad-header-size:
  meaning: header_size is outside [92, sector size]
  action: magic-tier hit; not a usable GPT header

gpt-bad-my-lba:
  meaning: my_lba is 0 or equals alternate_lba
  action: magic-tier hit; not a usable GPT header

gpt-disk-truncated:
  meaning: the table describes a disk larger than the data available from LBA 0
  action: the dump is short; partitions past the end get partition-outside-image / partition-truncated

gpt-entries-detached:
  meaning: the entry array is not adjacent to the header; the finding covers the header only
  action: informational; the entries were still read

gpt-entries-outside:
  meaning: the partition entry array is not inside the available data
  action: the map cannot be read; look for the backup header at the end of the disk

gpt-entry-array-crc-mismatch:
  meaning: the entry array CRC32 does not match the header
  action: entries may be stale or edited; compare with the backup map

gpt-entry-invalid:
  meaning: entries with a type GUID but no valid LBA range were skipped
  action: informational; check for hidden partitions by hand if the count is unexpected

gpt-entry-limit:
  meaning: more entries than the signature's max_entries; the rest were not read
  action: raise max_entries in signatures/core.toml

gpt-header-crc-mismatch:
  meaning: the header CRC32 does not match
  action: header edited or damaged; rely on the backup header if it verifies

gpt-origin-outside:
  meaning: LBA 0 of the described disk lies before the data (carved slice); disk_offset is absent
  action: partition offsets are disk-relative, not image-relative

gpt-primary-missing:
  meaning: no valid primary header; the partitions were recovered from the backup header
  action: expected on truncated or wiped disks; verify the map against the partition contents

gpt-signature-nonstandard:
  meaning: the header's signature is not "EFI PART", but its CRC32 matches over the bytes as stored
  action: the map is intact and was read; note that most tools will not find this header at all, and that the signature was already in this state when the CRC was computed

gpt-truncated-header:
  meaning: fewer than 92 bytes after the magic
  action: magic-tier hit at the end of the data; usually noise

gzip-bad-os:
  meaning: the OS byte is not a defined value
  action: magic-tier hit; probably not a gzip member

gzip-truncated-header:
  meaning: fewer bytes than the fixed header or the FEXTRA length needs
  action: magic-tier hit at the end of the data; usually noise

gzip-unusual-xfl:
  meaning: XFL is not 0, 2 or 4
  action: informational; unusual producer

image-word-swap-tail:
  meaning: the image size is not a multiple of the swap word; the last 1-3 bytes are passed through unswapped
  action: informational

image-corrected-view:
  meaning: the analysis ran on a corrected rendering of the image, and that rendering was written to flash/ so every offset in the manifest points at a real file
  action: work from the file named in the message; the evidence itself still holds the bytes as they were dumped

image-corrected-view-failed:
  meaning: the corrected view could not be written (the directory or the file could not be created, or the write was short)
  action: check free space and permissions and re-run; until then nothing on disk holds the bytes the offsets refer to

image-corrected-view-limit:
  meaning: the corrected view is larger than --max-carve-bytes and was not written
  action: raise --max-carve-bytes to write it; the offsets in this manifest are otherwise not reproducible from anything on disk

image-corrected-view-short:
  meaning: the evidence stopped returning bytes before its recorded size while the corrected view was written, so the file is short
  action: the image is unreadable past that point; check the acquisition

image-word-swapped:
  meaning: the dump has every 16- or 32-bit word byte-reversed; the analysis ran on a corrected view
  action: carved files are the corrected bytes (name suffix -swap16/-swap32); say so in the report

jffs2-bad-entry-name:
  meaning: a dirent name is empty, `.`, `..`, or contains `/` or NUL; the entry was skipped
  action: hostile or corrupt dirent; inspect the node at the offset in the message

jffs2-data-crc-mismatch:
  meaning: inode nodes whose data_crc does not match their payload; ignored for the live tree, kept for history with extra crc=bad
  action: bit rot or a partial write; treat the flagged versions as unverified

jffs2-decompress-failed:
  meaning: a data node's payload did not decode (corrupt stream, wrong size); its range was zero-filled and the entry marked truncated
  action: check the node offset in the message; the bytes may be recoverable by hand

jffs2-dir-loop:
  meaning: a dirent names one of its own ancestors, or a second name for a directory already walked; not descended
  action: hostile or corrupt dirent chain; the rest of the tree is intact

jffs2-dirty-gaps:
  meaning: non-node, non-erased bytes were skipped between nodes
  action: informational; dead data or padding inside the partition

jffs2-isize-exceeds-data:
  meaning: the inode's isize is larger than the bytes its data nodes cover; the tail is zero-filled
  action: informational: a sparse file, or data nodes lost to erasure or corruption

jffs2-limit-decompress-ratio:
  meaning: a data node claims more output than csize x max_decompress_ratio; refused before decoding, range zero-filled
  action: raise --max-decompress-ratio only for a trusted image; this is the decompression-bomb guard

jffs2-limit-file-bytes:
  meaning: an inode's isize or a node's dsize exceeds max_file_bytes; the data was cut or zero-filled there
  action: raise --max-bytes / max_file_bytes and re-run for that filesystem

jffs2-limit-files:
  meaning: max_files reached; the walk stopped
  action: raise --max-files and re-run

jffs2-limit-nodes:
  meaning: max_nodes_per_fs reached while scanning; later nodes were not read
  action: raise max_nodes_per_fs for a partition with millions of nodes

jffs2-limit-versions:
  meaning: a path had more history versions (all inodes that ever held it, unlink records included) than Limits::max_versions_per_entry; the oldest were dropped
  action: raise max_versions_per_entry; the newest versions were kept and the newest kept entry carries extra versions_dropped; the walk itself is not truncated

jffs2-missing-inode:
  meaning: a live dirent names an inode that has no usable inode node; the entry was emitted from the dirent alone (type, name, mctime)
  action: the inode's nodes were erased or failed their CRC; a mount would list the name but fail to stat it

jffs2-name-crc-mismatch:
  meaning: dirent nodes whose name_crc does not match the name; not used for any path
  action: corrupt name bytes; the node offset is in the message

jffs2-no-erase-size:
  meaning: fewer than two cleanmarkers, so the erase-block size was not inferred
  action: pass the erase size by hand when mounting through mtdram

jffs2-no-nodes:
  meaning: open() found no CRC-valid node header at any 4-byte offset
  action: not a JFFS2 partition, or a byte-swapped or ECC-interleaved dump

jffs2-node-crc-mismatch:
  meaning: nodes whose node_crc does not match; ignored for the live tree, kept for history with extra crc=bad
  action: bit rot, a partial write, or a hand-built node; the kernel would ignore them too

jffs2-node-malformed:
  meaning: nodes whose csize, nsize or name_len runs past totlen, or whose totlen is below the type's minimum; their payload was ignored
  action: hostile or corrupt node; count in the message

jffs2-node-truncated:
  meaning: node headers whose totlen runs past the end of the data; skipped
  action: the partition span is short or the length is hostile; check the end of the dump

jffs2-orphan-inode:
  meaning: inodes with nodes but no dirent ever naming them; emitted under lost+found/#<inode> with history
  action: the names were garbage-collected; content is still recoverable

jffs2-sink-error:
  meaning: the Sink refused an entry (unsafe path, its own limit); entry skipped, walk continues
  action: see the sink code in the message

jffs2-truncated:
  meaning: the last node's totlen runs past the data
  action: the dump or partition is short

jffs2-unknown-nodetype:
  meaning: nodes with a type this scanner does not know were counted
  action: informational; may be xattr, summary or vendor nodes

jffs2-unsupported-compression:
  meaning: data nodes compressed with rubinmips or dynrubin, which this reader does not decode; ranges zero-filled, entries marked truncated
  action: rare mkfs.jffs2 -X modes; mount the carved copy on Linux to read them

luks-bad-hdr-size:
  meaning: LUKS2 hdr_size is not a power of two in 16 KiB..4 MiB
  action: magic-tier hit; not a usable LUKS2 header

luks-bad-header:
  meaning: a cipher, mode, hash, uuid, checksum or label field is not a printable token
  action: magic-tier hit; probably not a LUKS header

luks-bad-json:
  meaning: the LUKS2 JSON area does not start with { or lacks keyslots/segments
  action: header damaged; cryptsetup luksDump will confirm

luks-bad-keyslots:
  meaning: a LUKS1 key slot has an unknown state or key material past the payload offset
  action: header damaged or edited

luks-bad-uuid:
  meaning: the uuid field is not in 8-4-4-4-12 form
  action: informational

luks-truncated:
  meaning: the header area up to the payload extends past the available data
  action: the dump is short; the encrypted payload is missing

luks-truncated-header:
  meaning: fewer bytes than the header needs, or the version field is missing
  action: magic-tier hit at the end of the data

luks-unsupported-version:
  meaning: the LUKS version is neither 1 nor 2
  action: magic-tier hit; probably not LUKS

lz4-bad-frame-descriptor:
  meaning: the FLG/BD bytes are not a valid LZ4 frame descriptor
  action: magic-tier hit; probably not an LZ4 frame

lz4-truncated-header:
  meaning: fewer than 6 bytes for the frame descriptor
  action: magic-tier hit at the end of the data

lzop-bad-block:
  meaning: a block's header is malformed, its bytes could not be read, or its LZO1X data did not decode; the payload ends there
  action: the stream is damaged or truncated; what decoded before the block is still emitted and the entry is marked truncated

lzop-block-walk-failed:
  meaning: the block headers could not be followed to the end of a member, so the stream's extent is unknown
  action: the file is truncated or the header lied; the finding carries extent unknown and no reader is handed it

lzop-checksum-mismatch:
  meaning: a block does not match the checksum lzop stored for it
  action: the decoded bytes are emitted anyway because they are what is on the medium, but treat the entry's contents as unverified

lzop-header-checksum-mismatch:
  meaning: an lzop member header does not match its own checksum
  action: the nine-byte magic still makes this a stream, but nothing in the header can be trusted, so it is not sized

lzop-limit-blocks:
  meaning: the walk stopped at its block or member cap
  action: informational; the stream may be longer than the finding claims

lzop-unsupported-method:
  meaning: the member names a compression method this build does not decode (lzop can be built against zlib)
  action: no payload is emitted for it; decompress with the lzop the image came from

manifest-parent-missing:
  meaning: a node names a parent that is not in the graph
  action: contributor bug in whatever produced the node; the node is kept

mbr-ebr-chain-limit:
  meaning: the EBR chain is longer than the signature's ebr_max_chain
  action: raise ebr_max_chain in signatures/core.toml or expect a loop

mbr-ebr-missing:
  meaning: a chain link points at a sector without 0x55AA
  action: the logical partitions after that link are missing

mbr-entry-invalid:
  meaning: an entry has a bad status byte, zero length or a start past the data
  action: informational; unused or damaged slot

mbr-partition-truncated:
  meaning: an entry ends past the available data
  action: the dump is short; the partition is partial

mbr-partitions-overlap:
  meaning: two entries of the same class overlap
  action: hand-edited or damaged table; decide which entry is real

partition-entry-unparsable:
  meaning: an item of the validator's partitions attr could not be parsed
  action: contributor bug in the validator or Recurse; the entry was skipped

partition-outside-image:
  meaning: the entry starts past the end of the data; nothing was carved
  action: the dump is short or the table belongs to a larger disk

partition-protective:
  meaning: the MBR 0xEE entry only guards a GPT; the GPT entries are the partitions
  action: informational

partition-rescan:
  meaning: found by scanning the partition on its own; the whole-image scan missed it
  action: informational; usually an aligned filesystem with a short magic

partition-table-nested:
  meaning: a table that starts inside another table's entry describes another disk; its entries were not expanded
  action: an MBR sector as file data or a disk image inside a partition; carve and analyse it separately

partition-truncated:
  meaning: the entry extends past the end of the data; clamped (claimed_size keeps the original)
  action: the dump is short; the partition is partial

qnx-ifs-bad-compressed-block:
  meaning: the first compressed block of an IFS has a zero length or runs past the data, or a zlib image has no gzip stream at startup_size
  action: the startup header is real but the payload is not where it says; carve from startup_size and inspect

qnx-ifs-bad-header:
  meaning: open() found no valid startup header (signature, version 1, header_size 256, sane startup_size)
  action: the finding was noise or the header is corrupt; nothing was walked

qnx-ifs-bad-image-header:
  meaning: dir_offset, hdr_dir_size and image_size of the image filesystem header are not nested
  action: the image header is corrupt; carve the image and inspect the directory by hand

qnx-ifs-bad-startup-size:
  meaning: startup_size is below 256, unaligned or larger than stored_size
  action: the header is corrupt or patched; the finding stays at magic tier

qnx-ifs-decompress-cap:
  meaning: max_file_bytes or max_decompress_ratio stopped the decompression of the image filesystem; the prefix was kept
  action: raise --max-bytes / max_decompress_ratio if the directory or files are cut

qnx-ifs-decompress-failed:
  meaning: a compressed block of the image filesystem did not decode; the image is cut there
  action: the block is corrupt or uses a variant this decoder does not know; compare with dumpifs

qnx-ifs-dirent-corrupt:
  meaning: a directory entry has a bad size, no NUL-terminated path, an unknown type or a symlink target outside the entry
  action: entries after a bad size were not read; carve the image and inspect the directory

qnx-ifs-entry-skipped:
  meaning: a directory entry has inode 0, which mkifs defines as an entry to skip
  action: informational; the entry is counted in skipped_entries

qnx-ifs-file-out-of-range:
  meaning: a file's data range lies past the end of the image data; the prefix inside it was recovered
  action: the entry is truncated; the image is cut (decompression stopped early) or the entry is corrupt

qnx-ifs-image-checksum-bad:
  meaning: the image filesystem does not sum to zero, or is truncated so the sum cannot be checked
  action: the image was modified or cut after mkifs; treat the contents as unverified

qnx-ifs-image-truncated:
  meaning: hdr_dir_size or image_size extends past the available image data, or the compressed block chain has no terminator
  action: the directory or the data is cut; check whether the partition slice was complete

qnx-ifs-limit-blocks:
  meaning: more than max_blocks compressed blocks (validator TOML key) or more than max_nodes_per_fs (reader); the chain walk stopped and the decompressed image is cut there
  action: raise max_blocks on the signature, or max_nodes_per_fs for the reader, for a very large image

qnx-ifs-limit-file-bytes:
  meaning: max_file_bytes reached while streaming one file; the rest was dropped
  action: raise --max-bytes for the large file

qnx-ifs-limit-files:
  meaning: max_files reached; the rest of the directory was not emitted
  action: raise --max-files

qnx-ifs-limit-nodes:
  meaning: max_nodes_per_fs directory entries parsed; the rest of the directory was not read
  action: raise max_nodes_per_fs for an image with millions of entries

qnx-ifs-no-image-header:
  meaning: no "imagefs" signature at startup_size (after decompression when compressed)
  action: the payload is not an image filesystem, is compressed with an unknown scheme, or decompression produced nothing

qnx-ifs-not-open:
  meaning: walk() was called before a successful open() (caller bug)
  action: contributor error; analyze() never does this

qnx-ifs-sink-error:
  meaning: the Sink refused an entry (unsafe path, limit, I/O error); the entry was skipped
  action: see the message for the sink code; a path with .. or a leading slash is evidence of tampering

qnx-ifs-startup-checksum-bad:
  meaning: the startup header and code do not sum to zero; the message says when the residual is flags2 alone
  action: expected on shipped images (flags2 or info[] patched after mkifs); a residual that is not flags2 means the startup code was modified

qnx-ifs-stored-checksum-bad:
  meaning: the compressed area of an IFS does not sum to zero
  action: the image was modified or cut after mkifs; the reader still decodes what it can

qnx-ifs-stored-size-mismatch:
  meaning: stored_size disagrees with the structures (startup_size + image_size, or the compressed block chain)
  action: informational; the structures win

qnx-ifs-truncated:
  meaning: startup_size, image_size or the compressed block chain extends past the available data
  action: the slice is incomplete; carve a larger range

qnx-ifs-truncated-header:
  meaning: fewer than 64 bytes follow the startup magic
  action: a magic at the very end of the data; nothing to validate

qnx-ifs-unknown-machine:
  meaning: the startup header machine field is not an ELF machine QNX Neutrino runs on
  action: a new port or a corrupt field; the attr shows the raw value

qnx-ifs-unsupported-compression:
  meaning: flags1 selects a compression code other than zlib, lzo, ucl or lz4
  action: carve the image; the compressed payload needs a decoder this build lacks

qnx6-bad-root-pointer:
  meaning: a root-node pointer of the superblock (inode table, bitmap or longfile tree) lies beyond num_blocks
  action: the superblock is damaged or the geometry is wrong; the tier stays structural and the reader will report the tree as corrupt

qnx6-bad-superblock:
  meaning: a superblock has an impossible block size, zero counts, more than 5 levels of indirection or an inode table too small for the root; it is not used
  action: if both superblocks are unusable the reader refuses the image; carve it and inspect the superblocks at 0x2000 and after the last data block by hand

qnx6-bad-symlink:
  meaning: a symlink inode claims a target longer than PATH_MAX (1024); the target was cut there
  action: hostile or corrupt inode; the entry is marked truncated

qnx6-block-out-of-range:
  meaning: a block pointer (or an indirect block) of an entry maps outside the data area or could not be read; the range was zero-filled and the entry marked truncated
  action: corrupt pointer tree or a truncated image; the affected file blocks are listed in the message

qnx6-deleted-blocks-reused:
  meaning: a deleted inode-table record points at blocks the current bitmap shows allocated again; those blocks were zero-filled rather than reported as the deleted file's content
  action: the data of that deleted file was overwritten by a newer file; only the metadata is recoverable

qnx6-dir-loop:
  meaning: a directory entry names one of its own ancestors, or a second name for a directory already walked; not descended
  action: hostile or corrupt directory; the rest of the tree is intact

qnx6-dirent-corrupt:
  meaning: a directory entry has an impossible name length (0 or 28..254), a name with a slash or NUL, or names an unused inode; skipped. As an Info count, inode-table records with data that neither snapshot names (emitted under lost+found/#<inode>)
  action: inspect the directory block by hand if the name matters; lost+found entries need their name recovered from other evidence

qnx6-inode-tree-corrupt:
  meaning: an inode record, an indirect block of the inode table or a directory block could not be read (past the table, in an unused block or outside the data area); Error when it is the root of a snapshot, Warning for one entry or block
  action: the snapshot is damaged; compare with the other superblock (the reader already walked it when history is on)

qnx6-limit-file-bytes:
  meaning: an entry is larger than max_file_bytes; its data was cut there and the entry marked truncated
  action: raise --max-file-bytes for large files

qnx6-limit-files:
  meaning: max_files reached; the walk stopped
  action: raise --max-files and re-run

qnx6-limit-nodes:
  meaning: max_nodes_per_fs metadata records (directory blocks, directory entries and inode records) were parsed; the walk stopped
  action: raise max_nodes_per_fs for a filesystem with millions of entries

qnx6-limit-versions:
  meaning: more history entries for one path than max_versions_per_entry; the extra ones were dropped
  action: raise max_versions_per_entry; the live tree is complete

qnx6-longfile-checksum:
  meaning: a long file name's directory-entry checksum does not match the name in the longfile table; the name was used anyway
  action: informational: an MMI-variant filesystem (which uses another checksum) or a stale entry

qnx6-longfile-corrupt:
  meaning: a long-name directory entry points past the longfile table, into an unused block, or at a record with length 0 or above 510; the entry was skipped
  action: corrupt directory or longfile table; the inode number is in the message

qnx6-no-superblock:
  meaning: neither the superblock at 0x2000 nor one at the end of the span is usable; open() failed
  action: the span is not a QNX6 filesystem or both superblocks are destroyed; identification only

qnx6-serial-tie:
  meaning: both superblocks carry the same serial; the primary is the current snapshot and the second holds no distinct history
  action: informational; a freshly formatted or never-committed filesystem

qnx6-sink-error:
  meaning: the Sink refused an entry (unsafe path, duplicate or a sink limit); the entry was skipped
  action: see the sink code in the message

qnx6-superblock-bad-crc:
  meaning: a superblock's CRC-32 (polynomial 0x04C11DB7, seed 0, over bytes 8..511) does not verify
  action: the superblock may be stale or damaged; a checksum-valid superblock is preferred over it when both exist, and the tier stays consistent

qnx6-superblock-single:
  meaning: only one superblock was found (the other is missing, wiped or unusable); only one snapshot is available
  action: no snapshot history can be recovered; deleted inode-table records are still reported

qnx6-truncated:
  meaning: num_blocks x blocksize claims more bytes than the span holds; the size was clamped and blocks past the end read as out of range
  action: a truncated acquisition or a hostile superblock; the tier stays structural

qnx6-unsupported-feature:
  meaning: the superblock version is not 4.x (Warning), or the iclaim/iextra trees hold data this reader does not decode (Info)
  action: the layout was verified on version 4.3 automotive images only; compare the walk against qnxmount

region-high-entropy:
  meaning: an unidentified region's bytes are high-entropy and no signature matched anywhere in it; it is compressed, encrypted or a format this build does not know
  action: entropy cannot tell compression from encryption (xz output is statistically identical to AES), so treat "random" as a lead, not a verdict; carve the region and try the vendor's tooling

region-unidentified:
  meaning: no signature matched in this gap of at least min_region_bytes
  action: check fill (0xff/0x00 is erased or padding); otherwise strings or entropy tools

romfs-bad-first-header:
  meaning: the first file header points past the end of the image
  action: structural-tier hit; damaged or not romfs

romfs-bad-header:
  meaning: a file header is unreadable or has an empty name
  action: the rest of that directory list is not walked; entries before it are still emitted

romfs-bad-link:
  meaning: a hard link does not resolve to a readable header, or a chain of them loops
  action: the entry is skipped; the image is damaged or the offset was forged

romfs-bad-magic:
  meaning: no "-rom1fs-" at the start of the span
  action: contributor error or a stale signature; the node keeps the validator's finding

romfs-bad-name:
  meaning: the volume name is not printable ASCII
  action: magic string inside other data; ignore

romfs-bad-size:
  meaning: full_size cannot hold the header and a file entry
  action: magic-tier hit; ignore

romfs-checksum-mismatch:
  meaning: the header checksum over the first 512 bytes is not zero
  action: modified or damaged image; extract with care

romfs-cycle:
  meaning: a directory list or a directory's first child points at a header already visited
  action: the branch is cut there; romfs is a graph of raw offsets and nothing in the format forbids a loop

romfs-limit-depth:
  meaning: directory nesting went deeper than the reader's bound
  action: the image loops through fresh offsets each step; the branch is not descended

romfs-limit-nodes:
  meaning: max_nodes_per_fs was reached
  action: raise --max-nodes-per-fs for a trusted image; this is the guard against a list that never ends

romfs-not-open:
  meaning: walk() was called before a successful open()
  action: contributor error in a caller, not something an image causes

romfs-sink-error:
  meaning: the Sink refused an entry (unsafe path or a limit)
  action: see the sink-* code quoted in the message

romfs-truncated:
  meaning: full_size extends past the available data
  action: the dump or partition is short

romfs-truncated-entry:
  meaning: an entry claims more bytes than the image holds
  action: what was present is still emitted and the entry marked truncated; the image is short or the size was forged

romfs-truncated-header:
  meaning: fewer than 16 bytes for the superblock
  action: magic-tier hit at the end of the data

rules-bad-kind:
  meaning: a rule's `kind:` is not regex, literal, hex or glob-path
  action: use one of those four

rules-bad-pattern:
  meaning: a rule's pattern does not compile, or its hex is not whole bytes
  action: the message names the pack, the rule and the engine's complaint; the whole pack is refused so a rule is never silently dropped

rules-bad-rule:
  meaning: an entry in `rules:` is not a map
  action: each rule is a map of keys; check the indentation

rules-bad-scope:
  meaning: a rule's `scope:` lists something other than files or regions
  action: use either or both

rules-bad-severity:
  meaning: a rule's `severity:` is not info, low, medium, high or critical
  action: use one of those five

rules-bad-validate:
  meaning: a rule names a `validate:` filter this build does not have
  action: the built-ins are vin-checksum, luhn and mac-not-broadcast; an unknown one is refused rather than ignored, so a rule never silently loses its check

rules-bad-version:
  meaning: a pack's `version:` is not a number
  action: use an integer

rules-bad-yaml:
  meaning: a rule pack is not valid YAML, or its top level is not a map
  action: fix the pack; the message carries the parser's own complaint and the file it came from

rules-duplicate-id:
  meaning: two rules in one pack share an id
  action: rename one; a duplicate would make a hit ambiguous about which rule produced it

rules-empty-scope:
  meaning: a rule's `scope:` is present but lists nothing
  action: remove it to mean both, or name at least one

rules-file-unreadable:
  meaning: an extracted file or a region could not be read back for rule matching
  action: the entry is in the listing but was not searched; check permissions on the case directory

rules-limit-hits:
  meaning: the sweep reached --max-hits and stopped
  action: raise it, or narrow the packs; the hits kept are the first found in a deterministic order, not a sample

rules-no-id:
  meaning: a rule has no `id:`
  action: every hit names the rule that found it, so an id is required

rules-no-image-view:
  meaning: unidentified regions were not searched because no image view was available
  action: this happens when a word-swapped image's corrected view was too large to write; raise --max-carve-bytes to get region coverage

rules-no-name:
  meaning: a pack has no `pack:` key, so its rules could not be attributed to anything
  action: give the pack a name; it appears on every hit the pack produces

rules-no-pattern:
  meaning: a rule has no `pattern:`
  action: add one, or remove the rule

rules-no-rules:
  meaning: a pack has no `rules:` sequence, or it is empty
  action: a pack that matches nothing is almost always an editing mistake, so it is refused rather than loaded

rules-set-too-large:
  meaning: the combined patterns exceed the matcher's memory bound
  action: split the packs or simplify the largest patterns; the bound is what keeps a pack from exhausting the host

rules-unreadable:
  meaning: a pack file named with --rules could not be opened
  action: check the path and permissions

scan-hit-limit:
  meaning: the scan stopped after ScanOptions::max_hits; the rest of the span was not scanned
  action: the finding list is incomplete; raise max_hits (a contributor option) or scan a sub-range

sink-duplicate-path:
  meaning: an entry's path already existed on disk; it was written with a ~N suffix (or no free suffix was left)
  action: the filesystem has duplicate names or an earlier walk left files; listing.yaml has the host path

sink-io-error:
  meaning: a host write, mkdir or stat failed
  action: check free space and permissions; the entry is truncated or missing

sink-limit-bytes:
  meaning: the run-wide max_bytes budget was reached; data truncated
  action: re-run with a larger --max-bytes

sink-limit-file-bytes:
  meaning: an entry exceeded Limits::max_file_bytes; data truncated
  action: contributor option; the file on disk is partial

sink-limit-files:
  meaning: Limits::max_files entries were already emitted
  action: re-run with a larger --max-files

sink-name-escaped:
  meaning: on a Windows host the entry's name is not a valid Win32 file name (reserved device name, backslash, colon, trailing dot or space, control byte); it was written under an escaped name recorded in extra host_name
  action: informational; listing.yaml keeps the exact path from the filesystem and host_name says where the bytes landed (docs/CASE_LAYOUT.md "Host file-name escaping")

sink-not-directory:
  meaning: a path component exists on the host and is not a directory
  action: use an empty case directory

sink-protocol:
  meaning: begin_file/write/entry called out of order (reader bug)
  action: contributor error in the reader

sink-root-invalid:
  meaning: the case directory root is empty, not creatable or not a directory
  action: fix the --out path

sink-special-skipped:
  meaning: a device, fifo, socket or unknown entry was recorded but not created on disk
  action: informational; the metadata is in listing.yaml

sink-symlink-component:
  meaning: a directory component on the host is a symlink or reparse point; refused
  action: use a clean case directory; this guards against escaping the tree

sink-symlink-unsupported:
  meaning: the host cannot create the symlink; it is recorded only
  action: informational (Windows without privilege); listing.yaml has the target

sink-symlink-bad-target:
  meaning: the symlink's target is empty or contains a NUL byte, which no host can create; the entry is recorded only
  action: a deleted or damaged record whose target data is gone or reused; the listing keeps the entry and its raw target

sink-unsafe-path:
  meaning: the entry path is empty, absolute (leading /), contains a .. component or a NUL byte; refused (a name the host cannot store is escaped, never refused)
  action: hostile or damaged filesystem; the entry name is in the message

sink-version-skipped:
  meaning: a superseded or deleted version was recorded but not written (no --history)
  action: re-run with --history to extract it

sparse-bad-chunk:
  meaning: an Android sparse chunk has an unknown type or an unwalkable size, or the chunks do not cover the blocks the header claims
  action: the expanded image is short or stops early; carve the sparse image and try simg2img

sparse-bad-chunk-type:
  meaning: a chunk has a type other than raw, fill, don't-care or crc32
  action: the image is damaged or not sparse; the walk stopped there

sparse-bad-header:
  meaning: header sizes or block size are out of range
  action: magic-tier hit; probably not a sparse image

sparse-block-count-mismatch:
  meaning: the chunks cover a different number of blocks than the header claims
  action: damaged or truncated image; expanded size is unreliable

sparse-chunk-size-mismatch:
  meaning: a chunk's total_sz disagrees with its type and block count
  action: damaged image; the walk stopped there

sparse-truncated:
  meaning: a chunk header or its data lies past the end of the data
  action: the dump is short

sparse-truncated-header:
  meaning: fewer than 28 bytes for the file header
  action: magic-tier hit at the end of the data

sparse-unknown-version:
  meaning: the version is not 1.0
  action: magic-tier hit; not a known sparse format

squashfs-bad-block-size:
  meaning: block_size is not a power of two in 4 KiB..1 MiB
  action: magic-tier hit; not a usable superblock

squashfs-bad-bytes-used:
  meaning: bytes_used is smaller than the superblock
  action: magic-tier hit; not a usable superblock

squashfs-bad-compression:
  meaning: the compression id is not 1..6
  action: magic-tier hit; vendor variant or noise

squashfs-bad-entry-name:
  meaning: a directory entry name is empty, ., .., or contains / or NUL; skipped
  action: hostile or damaged image; note the skipped entry

squashfs-bad-fragment:
  meaning: a fragment index is outside the table or unreadable; the tail was zero-filled
  action: the file is partial (truncated flag); compare with unsquashfs

squashfs-bad-id:
  meaning: a uid/gid index is outside the id table; reported as 0
  action: ownership of that entry is unknown

squashfs-bad-inode-type:
  meaning: an inode type is outside 1..14; the entry was skipped
  action: damaged image; note the skipped entry

squashfs-bad-superblock:
  meaning: open() refused the superblock (size, magic, block_log, block_size or bytes_used)
  action: the validator hit was not a usable filesystem; inspect by hand

squashfs-bad-xattr:
  meaning: an xattr id is outside the xattr table
  action: informational; the xattr count is omitted for that entry

squashfs-block-corrupt:
  meaning: a data or fragment block did not decode or has an impossible size; zero-filled
  action: the file is partial (truncated flag); compare with unsquashfs

squashfs-block-log-mismatch:
  meaning: block_log disagrees with block_size
  action: magic-tier hit; not a usable superblock

squashfs-data-truncated:
  meaning: a data block lies past the end of the image
  action: the image is cut; the file ends there

squashfs-dir-loop:
  meaning: a directory entry refers to one of its own ancestors; not descended
  action: hostile image; note it in the report

squashfs-limit-file-bytes:
  meaning: a symlink target is longer than Limits::max_file_bytes; the entry was skipped
  action: hostile image; contributor limit

squashfs-limit-files:
  meaning: Limits::max_files reached; the walk stopped
  action: re-run with a larger --max-files

squashfs-limit-nodes:
  meaning: Limits::max_nodes_per_fs reached, or one listing exceeds it; the walk or listing was cut
  action: contributor limit; the listing is incomplete

squashfs-metadata-corrupt:
  meaning: a metadata block or a structure inside it is unreadable; walk fails at the root, otherwise the entry is skipped
  action: damaged or unsupported image; compare with unsquashfs

squashfs-minor-version:
  meaning: s_minor is not 0; parsed as 4.0
  action: informational

squashfs-root-invalid:
  meaning: root_inode is not a directory; the walk fails
  action: damaged superblock; nothing was extracted

squashfs-sink-error:
  meaning: the Sink refused an entry (unsafe path or its own limit); the walk continued
  action: see the sink-* code in the message

squashfs-table-order:
  meaning: the inode table does not precede the directory table
  action: unusual producer; the finding stays at structural tier

squashfs-table-outside:
  meaning: a table pointer lies outside bytes_used
  action: damaged superblock; the finding stays at structural tier

squashfs-truncated:
  meaning: bytes_used exceeds the available data (validator)
  action: the dump or partition is short

squashfs-truncated-image:
  meaning: bytes_used exceeds the span (reader)
  action: the dump or partition is short; expect data-truncated entries

squashfs-truncated-superblock:
  meaning: fewer than 96 bytes after the magic
  action: magic-tier hit at the end of the data

squashfs-unsupported-compression:
  meaning: the compression id is unknown; compressed blocks cannot be decoded
  action: vendor compressor; extract with the vendor's tool

squashfs-unsupported-version:
  meaning: the major version is not 4
  action: SquashFS 1-3; use an old unsquashfs

super-bad-geometry:
  meaning: the liblp geometry magic is present but its fields are not a super's
  action: informational; four bytes at a fixed offset turn up in unrelated data, and this is what that looks like

super-bad-metadata:
  meaning: the geometry parses but metadata slot 0 does not, or a table runs outside the slot
  action: the structure has no extent and no reader is asked to open it; the backup slots are not read yet

super-tables-checksum-mismatch:
  meaning: the partition map does not match the SHA-256 the header stores over it
  action: the extents it lists are not trustworthy, so nothing was claimed or extracted; dump the super and inspect the metadata slots by hand

super-truncated:
  meaning: the block-device table describes more bytes than the data holds
  action: the dump is short; the logical partitions near the end will be missing or partial

super-no-device-size:
  meaning: the block-device table does not state the super's size
  action: the structure has no extent; carve it by hand if the partitions inside matter

super-extent-outside:
  meaning: a logical partition names an extent that runs past the end of the super
  action: that entry is short; the map disagrees with the image, so treat both as suspect

super-partition-empty:
  meaning: a logical partition has no extents - the slot exists but holds nothing
  action: informational; an unpopulated A/B slot looks like this

super-partition-unnamed:
  meaning: a logical partition's name field is empty, so it was emitted by index
  action: informational; the partition is still extracted

tar-bad-header:
  meaning: a tar member header is not readable, so the walk stops there
  action: the archive is damaged or the ustar magic was a false positive; earlier members are still extracted

tar-bad-pax-record:
  meaning: a pax extended header record is malformed; the rest of that record block is ignored
  action: the member keeps its ustar name and size, which is usually still correct

tar-checksum-mismatch:
  meaning: a tar member header does not match its own checksum
  action: the magic is probably a false positive inside other data; nothing before it is affected

tar-limit-entries:
  meaning: Limits::max_nodes_per_fs or the signature's max_entries was reached inside a tar archive
  action: re-run with a larger cap if the remaining members matter

tar-no-end-marker:
  meaning: no end-of-archive block was reached and no member verified, so the archive has no extent and claims no bytes
  action: informational; this is what a stray ustar magic in other data looks like. An archive that really was cut short verifies at least one member and gets tar-unterminated instead

tar-unterminated:
  meaning: no end-of-archive block, but complete members verified; the extent is the bytes they account for
  action: those members were extracted; the archive is incomplete, so expect its tail to be missing - on the router-wrt image the cause is a gzip whose CRC failed

tar-truncated:
  meaning: a tar member or the archive itself runs past the available data
  action: the dump is short; entries before the cut are still extracted

ubi-bad-peb:
  meaning: one or more PEBs have an unreadable erase-counter header and were skipped by the volume rebuild
  action: the flash has bad or damaged blocks; the volumes those PEBs held LEBs for are short, so check ubi-leb-gap on each volume

ubi-ec-crc-mismatch:
  meaning: the erase-counter header CRC does not match; size unknown
  action: a corrupt first PEB; try the next PEB or ubireader

ubi-ec-fields-insane:
  meaning: the EC header CRC is fine but version or offsets are out of range
  action: unusual or hostile image

ubi-leb-gap:
  meaning: a volume is missing one or more logical erase blocks; they are filled with 0xFF so the blocks after them keep their offsets
  action: the image is partial or the blocks were bad; a filesystem on the volume will read past the gap but the gap's own contents are lost

ubi-leb-superseded:
  meaning: a volume holds an older copy of a logical erase block, left by an interrupted update or a wear-levelling move
  action: re-run with --history to extract the older copies; each is the block as it was before it was rewritten

ubi-limit-entries:
  meaning: Limits::max_nodes_per_fs was reached before every volume was emitted
  action: raise --max-files; the volumes already written are complete

ubi-no-volumes:
  meaning: no PEB carries a volume-identifier header, so there is no volume to rebuild
  action: the image is erase-counter headers only (a freshly formatted flash), or the VID headers are damaged

ubi-single-peb:
  meaning: no second EC header was found, so the PEB size and image size are unknown
  action: a single PEB or a mis-sized dump; identification only

ubi-truncated-header:
  meaning: fewer than 64 bytes for the EC header
  action: magic-tier hit at the end of the data

ubi-vtbl-unreadable:
  meaning: the layout volume (0x7FFFEFFF) is missing or holds no volume-table record whose CRC matches, so no volume name is known
  action: volumes are emitted as vol<id> instead; the contents are unaffected

ubifs-bad-index:
  meaning: the on-flash index did not parse to the end (a branch points at something that is not an index node, or the tree is too deep or too large)
  action: the volume is damaged or its erase blocks are not contiguous; what the index did yield is still walked, and a UBIFS inside raw UBI blocks needs the volume reassembled first

ubifs-bad-magic:
  meaning: the reader was opened on bytes whose first node is not a UBIFS superblock node
  action: contributor error or a stale signature; the node keeps the validator's finding

ubifs-bad-master:
  meaning: neither copy of the master node has a matching CRC, so nothing says where the index root is
  action: usually a UBIFS superblock found at a raw offset inside a UBI image, where LEB 1 is not the master node; reassemble the volume (docs/formats/ubi.md) and re-run

ubifs-bad-node:
  meaning: an inode node is unreadable or fails its CRC
  action: the entry is still listed with whatever the node holds; treat its metadata as unverified

ubifs-bad-leb-layout:
  meaning: log/lpt/orphan LEB counts do not fit into leb_cnt
  action: structural-tier hit; damaged superblock

ubifs-bad-superblock:
  meaning: superblock fields are out of range
  action: magic-tier hit; probably a non-superblock node

ubifs-decompress-failed:
  meaning: a data node's payload did not decode, or it names a compression type UBIFS does not define
  action: the block is zero-filled and the file marked truncated; the volume is damaged or uses a compressor this build lacks

ubifs-deleted-unresolved:
  meaning: a directory entry pointing at inode 0 records that something was unlinked, but the entry it removed or the directory that held it is no longer on the medium
  action: informational; the deletion happened, the name or the content behind it has already been reclaimed

ubifs-directory-loop:
  meaning: a directory is its own ancestor, so the walk would never end
  action: the index is damaged or crafted; the branch stops there and everything else is still walked

ubifs-crc-mismatch:
  meaning: the superblock node CRC32 does not match
  action: damaged superblock; verify with ubireader

ubifs-history-scan:
  meaning: how many nodes the --history sweep found still on the medium, and how many superseded and deleted entries came out of them
  action: informational; it is the count analyze() cannot put in the node's attrs, because info() is read before the walk

ubifs-journal-unreplayed:
  meaning: the journal could not be replayed, so the tree is as of the last commit and anything written after it is missing
  action: the log head or its commit-start node is damaged; recent changes are not shown, which matters most on a dump taken from a running device

ubifs-limit-history-nodes:
  meaning: the --history sweep stopped after its node cap; states older than that point were not recovered
  action: the volume holds more nodes than the sweep will read; the live tree and what was recovered are complete, the rest is not

ubifs-limit-nodes:
  meaning: Limits::max_nodes_per_fs was reached before the tree was fully walked
  action: raise --max-files; what was emitted is complete

ubifs-missing-block:
  meaning: a file's data node could not be read; the block is zero-filled
  action: the volume is damaged or truncated; the file is marked truncated and its digest is of what was recovered

ubifs-missing-inode:
  meaning: a directory entry names an inode that has no inode node in the index or the journal
  action: the name is still listed, empty; the inode was lost to damage, or to a commit this dump caught mid-flight

ubifs-not-open:
  meaning: walk() was called before a successful open() (caller bug)
  action: contributor error; analyze() never produces this

ubifs-sink-error:
  meaning: the Sink refused an entry (unsafe path or its own limit)
  action: see the sink-* code quoted in the message

ubifs-truncated:
  meaning: leb_size * leb_cnt extends past the data; inside UBI the LEBs are not contiguous anyway
  action: informational for a UBI-embedded volume; a short dump otherwise

uimage-bad-multi-table:
  meaning: the size table of a multi-file or script uImage is unterminated or implausibly long
  action: the payload is emitted whole instead of split; carve the node and inspect it

uimage-data-crc-mismatch:
  meaning: the payload CRC32 does not match ih_dcrc
  action: modified or damaged payload; note it in the report

uimage-header-crc-mismatch:
  meaning: the header CRC32 does not match; fields not trusted
  action: magic-tier hit; probably noise or a damaged header

uimage-truncated:
  meaning: the payload extends past the available data
  action: the dump or partition is short

uimage-truncated-header:
  meaning: fewer than 64 bytes for the header
  action: magic-tier hit at the end of the data

validator-missing:
  meaning: a signature names a validator that is not registered; only the magic match is reported
  action: contributor error (missing anchor or builtin.cpp line)

verity-bad-algorithm:
  meaning: the hash algorithm is not sha256, sha1 or sha512
  action: magic-tier hit; probably noise

verity-bad-block-size:
  meaning: data or hash block size is not a power of two in 512..65536
  action: magic-tier hit; probably noise

verity-bad-hash-type:
  meaning: hash_type is neither 0 nor 1
  action: magic-tier hit; probably noise

verity-bad-salt-size:
  meaning: salt_size exceeds the 256-byte field
  action: magic-tier hit; probably noise

verity-truncated:
  meaning: the superblock plus hash tree extends past the available data
  action: the dump is short; the hash tree is partial

verity-truncated-header:
  meaning: fewer than 512 bytes for the superblock
  action: magic-tier hit at the end of the data

verity-unsupported-version:
  meaning: the superblock version is not 1
  action: magic-tier hit; probably noise

xz-bad-stream-flags:
  meaning: the stream flags are not valid
  action: magic-tier hit; probably not an xz stream

xz-header-crc-mismatch:
  meaning: the stream flags CRC32 does not match
  action: magic-tier hit; probably not an xz stream

xz-truncated-header:
  meaning: fewer than 12 bytes for the stream header
  action: magic-tier hit at the end of the data

yaffs2-bad-chunk:
  meaning: one or more chunks fail the checksum over their own tags and were skipped, so whatever they held is missing from its file
  action: the flash has bit errors or the image is damaged; the entries that lost a chunk are marked truncated

yaffs2-bad-header:
  meaning: an object's header chunk could not be read, or the object has no name to list it under
  action: the header chunk is damaged; the object's data may still come out under --history

yaffs2-broken-hardlink:
  meaning: an object is a hard link to an object that is not on the medium
  action: the target's chunks have been erased; the link is listed empty so the name is still on the record

yaffs2-directory-loop:
  meaning: a directory is its own ancestor, so the walk would never end
  action: defence in depth; a YAFFS2 object carries its own parent, so a cycle is not reachable from the root and this should not be producible

yaffs2-empty:
  meaning: the reader was opened on an empty Span
  action: the image is truncated at its first byte

yaffs2-history-scan:
  meaning: how many written chunks are on the medium, and how many superseded and deleted entries came out of them
  action: informational; it is the count analyze() cannot put in the node's attrs, because info() is read before the walk

yaffs2-limit-chunks:
  meaning: the walk stopped after its chunk cap; the rest of the image was not read
  action: the image is larger than the cap; what was read is complete, the rest is not

yaffs2-limit-nodes:
  meaning: Limits::max_nodes_per_fs was reached before the tree was fully walked
  action: raise --max-files; what was emitted is complete

yaffs2-missing-chunk:
  meaning: a file's data chunk could not be read; the block is zero-filled
  action: the image is truncated or damaged; the file is marked truncated and its digest is of what was recovered

yaffs2-no-grid:
  meaning: no page and spare size makes the chunk tags verify against their own checksum, so this is not a YAFFS2 chunk grid
  action: the region is not YAFFS2, or its spare (out-of-band) area was stripped from the dump, which leaves nothing to read

yaffs2-no-headers:
  meaning: the chunk grid verifies but no chunk carries an object header, so there is no tree
  action: the image is data chunks only; their contents are still carved with the region

yaffs2-no-objects:
  meaning: the reader found a chunk grid but no object header in it
  action: as yaffs2-no-headers; the node keeps the validator's finding

yaffs2-not-open:
  meaning: walk() was called before a successful open() (caller bug)
  action: contributor error; analyze() never produces this

yaffs2-size-beyond-image:
  meaning: an object header claims a file larger than every chunk of the image put together
  action: usually a damaged header; a genuinely sparse file can also do this, so the size is not clamped and the zeros past its last data chunk are inferred. --max-file-bytes bounds what is written

yaffs2-sink-error:
  meaning: the Sink refused an entry (unsafe path or its own limit)
  action: see the sink-* code quoted in the message

zip-bad-entry:
  meaning: a central-directory entry or a member's local header is not readable
  action: the archive is damaged; members before it are still extracted

zip-cd-offset-mismatch:
  meaning: the EOCD points the central directory somewhere other than where the walk found it
  action: usually a zip appended to another file, or a false positive; the reader falls back to the directory just before the EOCD

zip-decompress-failed:
  meaning: a deflated member did not inflate; it is emitted empty and marked truncated
  action: the member is damaged or encrypted; the rest of the archive is unaffected

zip-deferred-sizes:
  meaning: a member defers its sizes to a data descriptor or a zip64 extra field that could not be read, so the archive has no extent
  action: informational; raise max_descriptor_search in the signature if the archive is large

zip-limit-entries:
  meaning: Limits::max_nodes_per_fs or the signature's max_entries was reached inside a zip
  action: re-run with a larger cap if the remaining members matter

zip-no-central-directory:
  meaning: no central directory was reached, so the archive has no extent and claims no bytes
  action: informational; a stray PK\x03\x04 in other data looks like this, and so does a truncated archive

zip-no-eocd:
  meaning: the central directory does not end in an end-of-central-directory record
  action: the archive is truncated or the local-header hit was a false positive

zip-truncated:
  meaning: a member or the archive itself runs past the available data
  action: the dump is short; entries before the cut are still extracted

zip-unsupported-method:
  meaning: a member uses a compression method other than stored or deflate; it is emitted empty
  action: bzip2, LZMA and encrypted members need their own support; carve the archive and use unzip

zstd-bad-frame-header:
  meaning: reserved bits are set in the frame header descriptor
  action: magic-tier hit; probably not a zstd frame

zstd-truncated-header:
  meaning: fewer than 5 bytes for the frame header
  action: magic-tier hit at the end of the data
