src/discovery/validators/ext.cpp:
  block_groups: ceil((blocks_count - first_data_block) / blocks_per_group)
  block_size: 1024 << s_log_block_size
  blocks_count: s_blocks_count (64-bit when INCOMPAT_64BIT)
  blocks_per_group: s_blocks_per_group
  feature_compat: s_feature_compat as hex (rev 1)
  feature_incompat: s_feature_incompat as hex (rev 1)
  feature_ro_compat: s_feature_ro_compat as hex (rev 1)
  inode_count: s_inodes_count
  inode_size: s_inode_size (rev 1)
  inodes_per_group: s_inodes_per_group
  last_mount_time: s_mtime (epoch seconds)
  last_mounted: s_last_mounted directory (rev 1)
  last_write_time: s_wtime (epoch seconds)
  mount_count: s_mnt_count
  rev_level: "0 (good old) or 1 (dynamic)"
  state: "clean, not-clean or errors from s_state"
  superblock_checksum: "ok or mismatch when RO_COMPAT_METADATA_CSUM is set"
  uuid: s_uuid (rev 1)
  volume_name: s_volume_name (rev 1)

src/discovery/validators/fit.cpp:
  compatible: root compatible strings, comma-joined (dtb)
  configurations: "name:kernel=..,fdt=..,ramdisk=..;... from /configurations (fit)"
  default_configuration: /configurations/default (fit)
  description: root description property (fit)
  hash_failed: image hash nodes that did not match (fit)
  hash_ok: image hash nodes verified (fit)
  hash_unsupported: hash nodes with an unchecked algorithm or skipped by max_hash_bytes (fit)
  image_count: subnodes of /images (fit)
  images: "name:offset:size:type:compression;... offset relative to the FIT start, missing when outside the data (fit)"
  images_without_hash: images with no hash subnode (fit)
  model: root model property (dtb)
  nodes: nodes parsed from the structure block
  properties: properties parsed from the structure block
  strings_size: FDT size_dt_strings
  struct_size: FDT size_dt_struct
  timestamp: root timestamp property (fit)
  totalsize: FDT totalsize
  version: FDT header version

src/discovery/validators/gpt.cpp:
  alternate: "valid | invalid | outside: the header at alternate_lba"
  alternate_lba: alternate_lba field
  backup: "on a primary: valid | mismatch | invalid | outside for its backup"
  disk_guid: disk GUID
  disk_offset: span-relative offset of LBA 0 of the disk the table describes (absent when LBA 0 lies before the data)
  disk_size: "(last LBA + 1) * sector: alternate_lba for a primary, my_lba for a backup, never smaller than the farthest partition"
  entries_lba: partition entry array LBA
  entry_array_crc: "ok | mismatch (absent when the array is outside the data)"
  entry_count: number of entries in the array
  entry_size: size of one entry
  first_usable_lba: first_usable_lba field
  header_lba: my_lba of this header
  last_usable_lba: last_usable_lba field
  my_lba: alias of header_lba on a backup header (older consumers read it)
  partition_count: entries listed in partitions
  partitions: "pN:start_bytes:size_bytes:type_guid:unique_guid:name[:attrs=0x..];... disk-relative"
  primary: "on a backup: valid | mismatch | invalid | outside for its primary"
  revision: header revision as hex
  sector_size: "512 or 4096, from which signature matched"
  table: "gpt-primary | gpt-backup"

src/discovery/validators/gzip.cpp:
  extra_len: FEXTRA length when present
  flags: FLG byte as hex
  has_comment: "true when FCOMMENT is set"
  has_header_crc: "true when FHCRC is set"
  header_len: bytes from the magic to the start of the deflate data (FCOMMENT/FHCRC not walked)
  mtime: MTIME (epoch seconds, 0 when unset)
  original_name: FNAME when present, capped by max_name_len
  os: OS byte name
  text: "true when FTEXT is set"
  xfl: XFL byte

src/discovery/validators/jffs2.cpp:
  aligned_size: size rounded up to the erase size
  cleanmarkers: cleanmarker nodes counted
  dirent_nodes: dirent nodes counted
  dirty_gap_bytes: skipped bytes that were neither nodes nor erased
  erase_size: inferred erase-block size in bytes, or unknown
  erase_size_source: how erase_size was inferred (cleanmarker spacing)
  erased_blocks: erase blocks inside the walk holding nothing but an optional cleanmarker
  erased_gap_bytes: skipped bytes that were all 0xFF
  first_nodetype: nodetype of the first node as hex
  gaps: number of gaps skipped between nodes
  inode_nodes: inode nodes counted
  nodes: total nodes walked
  obsolete_nodes: nodes with the ACCURATE bit cleared (in-place obsoleted, NOR)
  padding_nodes: padding nodes counted
  summary_nodes: summary nodes counted (not parsed)
  unknown_nodes: nodes with an unrecognised nodetype
  xattr_nodes: xattr and xref nodes counted

src/discovery/validators/luks.cpp:
  checksum_alg: LUKS2 header checksum algorithm
  cipher: cipher name
  cipher_spec: LUKS2 segment cipher spec
  hash: hash spec (LUKS1) or JSON hash (LUKS2)
  hdr_offset: LUKS2 hdr_offset
  hdr_size: LUKS2 hdr_size
  kdf: LUKS2 keyslot KDF type
  key_bits: LUKS1 key length in bits
  key_slots_enabled: LUKS1 active key slots
  label: LUKS2 label
  mk_digest_iterations: LUKS1 master-key digest iterations
  mode: cipher mode
  payload_offset: payload offset in bytes
  payload_offset_sectors: LUKS1 payload offset in 512-byte sectors
  seqid: LUKS2 header sequence id
  subsystem: LUKS2 subsystem
  uuid: volume UUID
  version: "1 or 2"

src/discovery/validators/lz4.cpp:
  block_checksum: "true when every block carries a checksum"
  block_independence: "true when blocks are independent"
  block_max_size: "64KiB, 256KiB, 1MiB or 4MiB"
  content_checksum: "true when a content checksum follows the frame"
  content_size: decompressed size when the descriptor carries it
  dictionary_id: dictionary id as hex when present
  header_len: frame header length including the HC byte

src/discovery/validators/mbr.cpp:
  also_covers: "offset:512;... the EBR sectors of the logical chain, hidden from later hits"
  disk_offset: span-relative offset of LBA 0 (the table's own offset)
  disk_size: end of the farthest partition in bytes
  disk_signature: NT disk signature as 0x + 8 hex digits
  partition_count: entries listed in partitions
  partitions: "pN:start_bytes:size_bytes:type_byte[:boot][:logical];... p1-p4 primary, p5.. logical"
  protective: "true when an entry has type 0xEE"
  table: mbr-primary

src/discovery/validators/qnx6.cpp:
  atime: current superblock atime (Unix seconds)
  blocks_per_group: allocgroup field of the current superblock
  blocksize: block size in bytes
  ctime: current superblock ctime (Unix seconds)
  current_superblock: which superblock is the current snapshot (primary or secondary)
  data_start: offset of data block 0 (0x3000 rounded up to a block) as hex
  endian: byte order of the on-disk structures
  flags: superblock flags as hex
  free_blocks: free data blocks per the current superblock
  free_inodes: free inode records per the current superblock
  inode_table_size: bytes of the inode table (128 per record)
  longfile_size: bytes of the long file name table (one name per block)
  num_blocks: data blocks
  num_inodes: inode records
  root_levels: levels of indirection of the inode table
  second_serial: serial of the other superblock
  second_superblock_offset: offset of the second superblock relative to the filesystem start as hex, or none
  serial: serial of the current superblock (higher wins)
  version: superblock version1.version2
  volume_id: 16-byte volume id as hex

