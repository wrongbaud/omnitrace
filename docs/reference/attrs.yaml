  root_mtime: mtime of the root directory entry
  script_ino: inode of the boot script, when set
  skipped_entries: entries with inode 0 (qnx-ifs-entry-skipped), when any
  startup_checksum: "ok or mismatch: u32 sum of the startup region"
  startup_size: startup header startup_size
  startup_vaddr: startup header startup_vaddr (hex)
  stored_size: startup header stored_size
  symlinks: symlink entries
  version: startup header version

src/filesystems/squashfs/SquashfsReader.cpp:
  compression_id: numeric compression id
  exportable: "true when an export table exists"
  flags: superblock flags as hex
  fragments: fragment count
  gzip_level: gzip compressor option
  gzip_strategies: gzip compressor option
  gzip_window: gzip compressor option
  id_count: no_ids
  inodes: inode count
  lz4_flags: lz4 compressor option
  lz4_version: lz4 compressor option
  lzo_algorithm: lzo compressor option
  lzo_level: lzo compressor option
  magic: the four magic bytes as text
  mkfs_time: mkfs_time (epoch seconds)
  root_inode: root inode reference as hex
  version: "major.minor"
  xattr_ids: number of xattr ids (0 when there is no xattr table)
  xz_dict_size: xz compressor option
  xz_filters: xz compressor option
  zstd_level: zstd compressor option
