# attrs.yaml - one-line meaning for every attrs key a validator, reader or the
# analysis driver emits. scripts/gen_docs.py joins this with the source into
# docs/reference/ATTRS.md and fails when a key here is not emitted or a key in
# source has no entry here. Sections are keyed by the source file that sets
# the key; keys are sorted alphabetically inside each section.
#
# Format (a YAML subset read by scripts/gen_docs.py):
#   <source path>:
#     <key>: one line

src/discovery/Recurse.cpp:
  backup_header: "ok or crc-mismatch: state of the GPT backup header folded into this primary table node"
  backup_lba: LBA of the folded GPT backup header (my_lba of the backup)
  backup_offset: image offset (hex) of the folded GPT backup header
  block_size: block size reported by the filesystem reader (FilesystemInfo::block_size)
  boot: "true on an MBR entry with the 0x80 active flag"
  bytes: bytes the reader emitted for this filesystem (WalkResult::bytes)
  carve_skipped: "max-carve-bytes when the node was not carved because it exceeds --max-carve-bytes"
  carved_in: "partitions/<file> that already contains this find (it starts at the partition's first byte)"
  carved_path: "partitions/<file> holding exactly location.offset .. offset+length; node digests are that file's"
  category: signature category of the finding (filesystem, container, compressed, partition-table, kernel, bootloader, crypto, other)
  claimed_size: the entry's original size when it ran past the end of the data (partition-truncated)
  compression: compression reported by the filesystem reader (FilesystemInfo::compression)
  deleted: deletion records emitted with --history (WalkResult::deleted)
  dirs: directory entries emitted (WalkResult::dirs)
  entries: total entries emitted (WalkResult::entries)
  evidence: "id of the Evidence row (e1) on the Image node"
  files: regular-file entries emitted (WalkResult::files)
  fill: "0xff / 0x00 (or 0x..) when every byte of an unidentified region is that value: erased flash or padding"
  gpt_attributes: GPT attribute bits of the entry, when non-zero
  index: "pN, the slot number of a partition entry (MBR logicals count from p5)"
  label: GPT partition name (sanitized UTF-8) or the volume label a filesystem reader reports
  logical: "true on an MBR entry that came from the EBR chain"
  nested_image: true on a File node whose extracted bytes were re-scanned and hold a filesystem or partition table at structural or better and at least min_region_bytes long; the finds are its children
  nested: "true on a partition-table node found inside another table's entry; its entries were not expanded"
  others: device, fifo, socket and unknown entries emitted (WalkResult::others)
  protective: "true on an MBR 0xEE entry that only guards a GPT"
  role: "table on the node that represents a partition table itself"
  signature: name of the signature that produced the finding (Signature::name)
  superseded: superseded versions emitted with --history (WalkResult::superseded)
  symlinks: symlink entries emitted (WalkResult::symlinks)
  table: "mbr-primary | gpt-primary | gpt-backup: which table a partition node came from"
  truncated: "true when a limit stopped the walk, a carve was short, or a file entry is partial"
  type: MBR type byte (0x83) or GPT type GUID of a partition entry
  type_byte: the MBR type byte again, under the format-specific key
  type_guid: the GPT type GUID again, under the format-specific key
  unique_guid: GPT unique partition GUID
  word_swap: "swap16 or swap32 on the Image node when the dump was byte-reversed per word"
  word_swap_confidence: detector score (0-100) behind word_swap
  written: "false on a regular-file node that was not written to disk (extraction on, but the Sink skipped it)"

src/discovery/validators/android_boot.cpp:
  bootconfig_size: vendor boot v4 bootconfig section size
  cmdline: kernel command line (control bytes replaced by _, extra_cmdline appended)
  dtb_size: DTB section size (boot v2, vendor boot)
  extent: unknown when the validator walked the structure and could not find its end; the finding claims no bytes and no reader is asked to open it
  header_size: header size field (v2+)
  header_version: boot image header version 0-4
  id: 32-byte image id as hex
  kernel_addr: kernel load address (v0-2)
  kernel_size: kernel section size
  name: product name field
  os_patch_level: OS patch level decoded from os_version
  os_version: OS version decoded from os_version
  page_size: page size sections are aligned to
  ramdisk_addr: ramdisk load address (v0-2)
  ramdisk_size: ramdisk section size
  recovery_dtbo_size: recovery DTBO section size (v1-2)
  second_addr: second-stage load address (v0-2)
  second_size: second-stage section size (v0-2)
  signature_size: boot signature size (v4)
  tags_addr: kernel tags address (v0-2)
  vendor_ramdisk_size: vendor ramdisk section size (vendor boot)
  vendor_ramdisk_table_size: vendor ramdisk table size (vendor boot v4)

src/discovery/validators/android_sparse.cpp:
  block_size: blk_sz from the file header (multiple of 4)
  chunks_walked: chunk headers actually parsed before the walk stopped
  crc_chunks: number of CRC32 chunks
  dont_care_chunks: number of don't-care chunks
  fill_chunks: number of fill chunks
  image_checksum: header checksum field as hex
  output_size: total_blocks * block_size, the expanded image size
  raw_chunks: number of raw chunks
  total_blocks: total_blks from the header
  total_chunks: total_chunks from the header

src/discovery/validators/cpio.cpp:
  data_bytes: total bytes of member data the archive holds
  entries: members counted before the TRAILER!!! member
  extent: unknown when the validator walked the structure and could not find its end; the finding claims no bytes and no reader is asked to open it
  variant: newc | crc | odc, the header flavour

src/discovery/validators/tar.cpp:
  data_bytes: total bytes of member data the archive holds
  entries: members counted before the end-of-archive block (extended headers are not counted)
  extent: unknown when the validator walked the structure and could not find its end; the finding claims no bytes and no reader is asked to open it
  variant: ustar | gnu | pax, the header flavour

src/discovery/validators/cramfs.cpp:
  blocks: fsid.blocks (v2)
