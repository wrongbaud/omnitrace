  compressed_bytes: bytes of compressed payload inside the blocks (lengths excluded)
  dir_offset: image header dir_offset (first directory entry)
  entries: directory entries counted (root included), bounded by max_dir_entries
  files: regular-file entries among them
  flags1: startup header flags1 (hex)
  flags2: startup header flags2 (hex)
  hdr_dir_size: image header hdr_dir_size (end of the directory)
  image_checksum: "ok or mismatch: u32 sum of the image filesystem"
  image_flags: image header flags (hex)
  image_paddr: startup header image_paddr (hex)
  image_size: image header image_size (uncompressed images)
  imagefs_size: startup header imagefs_size (uncompressed image filesystem size)
  machine: "ELF machine name (aarch64, arm, x86_64, ...) or unknown(0x..)"
  mountpoint: default mountpoint from the image header
  paddr_bias: startup header paddr_bias (hex)
  preboot_size: startup header preboot_size, when non-zero
  ram_paddr: startup header ram_paddr (hex)
  ram_size: startup header ram_size
  script: "true when script_ino names a boot script"
  startup_checksum: "ok or mismatch: u32 sum of the startup header and code"
  startup_size: startup header startup_size (header, startup code, trailer)
  startup_vaddr: startup header startup_vaddr (hex)
  stored_checksum: "ok, mismatch or unverified: u32 sum of the compressed area"
  stored_size: startup header stored_size (the whole image as stored)
  version: startup header version (1)

src/discovery/validators/romfs.cpp:
  checksum: "ok or mismatch: header checksum over the first 512 bytes"
  full_size: full_size field in bytes
  volume_name: volume name

src/discovery/validators/squashfs.cpp:
  block_size: superblock block_size
